<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mis Vehículos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#3438c9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Alquiler diario de vehículos: misma estructura que Préstamos, en tono índigo */
:root{
  --bg:#f2f3fa; --card:#ffffff; --text:#191c33; --muted:#636884; --line:#dfe1ee; --soft:#eceefa;
  --primary:#3438c9; --primary-2:#5b62f0; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.16);
  --danger:#c0392b; --warn:#b7700a; --ok:#1e8e4e;
  --chip-ok:#e3f5ea; --chip-warn:#fdf0dc; --chip-bad:#fbe5e2; --chip-done:#e7e8f0;
  --day-pag:#2fa866; --day-parc:#e9a23b; --day-deb:#dc4a3a; --day-hoy:#9aa0c4; --day-libre:#d6d9ea;
  --shadow:0 1px 3px rgba(20,24,60,.08); --scrim:rgba(10,12,30,.5); --toast:#191c33; --toast-text:#fff;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1020; --card:#181a2e; --text:#e6e8f5; --muted:#9a9fbd; --line:#2a2d48; --soft:#21233b;
    --primary:#2a2d9a; --primary-2:#8c92ff; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.12);
    --danger:#ef6b5b; --warn:#f0a93b; --ok:#4cc77f;
    --chip-ok:#1d3a2a; --chip-warn:#3d2f17; --chip-bad:#42201c; --chip-done:#272a40;
    --day-pag:#3fbf78; --day-parc:#e9a23b; --day-deb:#ef6b5b; --day-hoy:#5d6285; --day-libre:#2e3150;
    --shadow:none; --scrim:rgba(0,0,0,.6); --toast:#e6e8f5; --toast-text:#0f1020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1020; --card:#181a2e; --text:#e6e8f5; --muted:#9a9fbd; --line:#2a2d48; --soft:#21233b;
  --primary:#2a2d9a; --primary-2:#8c92ff; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.12);
  --danger:#ef6b5b; --warn:#f0a93b; --ok:#4cc77f;
  --chip-ok:#1d3a2a; --chip-warn:#3d2f17; --chip-bad:#42201c; --chip-done:#272a40;
  --day-pag:#3fbf78; --day-parc:#e9a23b; --day-deb:#ef6b5b; --day-hoy:#5d6285; --day-libre:#2e3150;
  --shadow:none; --scrim:rgba(0,0,0,.6); --toast:#e6e8f5; --toast-text:#0f1020;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1100px;margin:0 auto}
header{background:var(--primary);color:var(--on-primary);padding-block:14px}
header .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:21px;flex:1;min-width:150px}
main{padding-block:16px 40px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px}
button:hover{filter:brightness(.97)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
header button{background:var(--head-btn);border-color:rgba(255,255,255,.3);color:var(--on-primary)}
header button.primary{background:var(--on-primary);color:var(--primary);border-color:var(--on-primary);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.small{padding:4px 10px;font-size:13px}
a.btn{display:inline-block;text-decoration:none;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px}
a.inicio{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--head-btn);border:1px solid rgba(255,255,255,.3);color:var(--on-primary);text-decoration:none;font-size:18px;font-weight:700}
.aviso{background:var(--chip-warn);color:var(--text);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.cobrohoy{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.cobrohoy .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cobrohoy h3{margin:0;font-size:17px}
.cobrohoy .meta{color:var(--muted);font-size:13px}
.cobrohoy .barra{height:10px;background:var(--line);border-radius:6px;margin:10px 0 4px;overflow:hidden}
.cobrohoy .barra i{display:block;height:100%;background:var(--ok);border-radius:6px}
.cobrohoy .nums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.cobrohoy .nums b{font-variant-numeric:tabular-nums}
.hoy-fila{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.hoy-fila:first-of-type{margin-top:10px}
.hoy-fila .q{font-weight:600;cursor:pointer}
.hoy-fila .sub{font-size:13px;color:var(--muted)}
.hoy-fila .btns{display:flex;gap:6px;flex-wrap:wrap}
.cobrohoy .listo{margin-top:10px;color:var(--ok);font-weight:600}
.cobrohoy details{margin-top:8px;font-size:14px}
.cobrohoy summary{cursor:pointer;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:100%}
textarea{resize:vertical;min-height:60px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.veh{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer;min-width:0;display:flex;flex-direction:column}
.veh:hover{border-color:var(--primary-2)}
.veh .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.veh h3{margin:0;font-size:17px}
.phone{color:var(--muted);font-size:13px}
.auto{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:14px;min-width:0}
.auto .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placa{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:700;font-size:12px;letter-spacing:.06em;border:1.5px solid currentColor;border-radius:5px;padding:1px 6px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.grid2 span{color:var(--muted)}
.grid2 b{font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.chip.ok{background:var(--chip-ok);color:var(--ok)}
.chip.warn{background:var(--chip-warn);color:var(--warn)}
.chip.bad{background:var(--chip-bad);color:var(--danger)}
.chip.done{background:var(--chip-done);color:var(--muted)}
.dias{display:flex;gap:3px;margin-top:12px}
.dias i{flex:1;height:8px;border-radius:3px;background:var(--day-hoy)}
.dias i.pag{background:var(--day-pag)} .dias i.parc{background:var(--day-parc)} .dias i.deb{background:var(--day-deb)}
.dias i.libre{background:var(--day-libre)} .dias i.na{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.dias i.hoy{background:transparent;outline:1.5px solid var(--day-hoy);outline-offset:-1.5px}
.dias i.hoy.pag{background:var(--day-pag);outline:none}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.rapidos{display:flex;gap:6px;flex-wrap:wrap}
.rapidos button{padding:4px 10px;font-size:13px}
.check{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;cursor:pointer;margin:0}
.check input{width:auto;margin:0}
.cargos td{vertical-align:middle}
.calmes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calmes b{font-family:var(--f-head);font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dn{text-align:center;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;padding-bottom:2px}
.cal button{aspect-ratio:1/1;padding:0;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;border-radius:10px;position:relative;min-width:0}
.cal button.hoy{outline:2px solid var(--day-hoy);outline-offset:-2px}
.cal button.on{background:var(--day-libre);border-color:var(--day-libre);color:var(--text)}
.cal button.on::after{content:"🌴";position:absolute;font-size:9px;top:1px;right:2px}
.cal button.pag:not(.on){border-bottom:3px solid var(--day-pag)}
.cal button.deb:not(.on){border-bottom:3px solid var(--day-deb)}
.cal button:disabled{opacity:.3;cursor:default}
.libres{display:flex;gap:6px;flex-wrap:wrap}
.libres span{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:20px;padding:3px 4px 3px 10px;font-size:13px}
.libres button{padding:2px 8px;font-size:12px;border-radius:20px}
.cardfoot .botones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;
  padding:max(20px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 20px max(12px, env(safe-area-inset-left, 0px));overflow:auto;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:760px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);min-width:0}
.modal.chico{max-width:420px}
.modal h2{margin:0 0 12px;font-size:19px}
.modal .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form h4{grid-column:1/-1;margin:10px 0 0;font-size:15px;padding-top:10px;border-top:1px solid var(--line)}
.form h4:first-of-type{border-top:0;padding-top:0;margin-top:0}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.preview{grid-column:1/-1;background:var(--soft);border-radius:8px;padding:10px;font-size:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.section{margin-top:18px}
.section h4{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.info div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.info span{display:block;font-size:12px;color:var(--muted)}
.info span.placa,.info span.punto{display:inline-block;color:inherit;font-size:12px}
.punto{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);border:1px solid rgba(128,128,128,.55);vertical-align:-1px;margin-right:5px;flex:none}
.incompleto{background:var(--chip-warn);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.info b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.destacado{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.destacado div{border:1px solid var(--line);border-radius:10px;padding:12px}
.destacado span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.destacado b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.destacado small{color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:var(--toast);color:var(--toast-text);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:600px){
  .form{grid-template-columns:1fr}
  .list{grid-template-columns:1fr}
}
</style>

<header>
  <div class="wrap gut">
    <a class="inicio" href="./" title="Volver al inicio" aria-label="Volver al inicio">←</a>
    <h1>Mis Vehículos</h1>
    <div id="menuMas"></div>
    <input type="file" id="fileImport" accept=".json,application/json" hidden onchange="importar(event)">
    <button class="primary" id="btnNuevo" onclick="abrirForm()">+ Nuevo alquiler</button>
  </div>
</header>

<main class="wrap gut">
  <div class="aviso" id="aviso" hidden></div>
  <div id="respaldoAviso" hidden></div>
  <div class="cobrohoy" id="hoy" hidden></div>
  <div class="toolbar">
    <input id="buscar" placeholder="Buscar por conductor, teléfono, placa o modelo..." oninput="render()">
    <div class="filters" id="filters">
      <button data-f="activos" class="on">Activos</button>
      <button data-f="deben">Deben</button>
      <button data-f="finalizados">Finalizados</button>
    </div>
  </div>
  <div class="list" id="list"><div class="empty">Cargando vehículos…</div></div>
</main>

<!-- Formulario alquiler -->
<div class="overlay" id="ovForm">
  <div class="modal">
    <div class="head"><h2 id="formTitle">Nuevo alquiler</h2><button class="small" onclick="cerrar('ovForm')" aria-label="Cerrar">✕</button></div>
    <form class="form" id="vehForm" onsubmit="guardarVehiculo(event)">
      <input type="hidden" name="id">
      <h4>👤 Conductor</h4>
      <div class="full"><label for="f_nombre">Nombre completo *</label><input name="nombre" id="f_nombre" required autocomplete="off"></div>
      <div><label for="f_doc">No. de DNI *</label><input name="documento" id="f_doc" required inputmode="numeric" autocomplete="off"></div>
      <div><label for="f_tel">Número de teléfono *</label><input name="telefono" id="f_tel" type="tel" required autocomplete="off"></div>
      <div class="full"><label for="f_dir">Dirección completa *</label><input name="direccion" id="f_dir" required autocomplete="off"></div>

      <h4>🚗 Vehículo</h4>
      <div><label for="f_marca">Marca *</label><input name="marca" id="f_marca" required minlength="3" placeholder="Ej: Toyota" autocomplete="off"></div>
      <div><label for="f_modelo">Modelo *</label><input name="modelo" id="f_modelo" required minlength="3" placeholder="Ej: Corolla" autocomplete="off"></div>
      <div><label for="f_color">Color *</label><input name="color" id="f_color" required minlength="3" placeholder="Ej: Gris" autocomplete="off"></div>
      <div><label for="f_placa">Placa *</label><input name="placa" id="f_placa" required style="text-transform:uppercase"></div>

      <h4>💵 Tarifa diaria</h4>
      <div><label for="f_tarifa">Cuánto paga por día *</label><input name="tarifa" id="f_tarifa" type="number" min="1" step="any" required oninput="preview()"></div>
      <div><label for="f_ini">Cobrar desde el día *</label><input name="fechaInicio" id="f_ini" type="date" required oninput="preview()"></div>
      <div id="wrapDesde" hidden><label for="f_desde">La nueva tarifa aplica desde</label><input name="tarifaDesde" id="f_desde" type="date" oninput="preview()"></div>
      <div class="preview" id="preview">Escribe la tarifa para ver el cálculo.</div>
      <div class="full actions">
        <button type="button" onclick="cerrar('ovForm')">Cancelar</button>
        <button type="submit" class="primary" id="btnGuardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Detalle -->
<div class="overlay" id="ovDetalle"><div class="modal" id="detalle"></div></div>

<!-- Daño o mantenimiento -->
<div class="overlay" id="ovCargo">
  <div class="modal chico">
    <div class="head"><h2 id="cgTitulo">Agregar</h2><button class="small" onclick="cerrar('ovCargo')" aria-label="Cerrar">✕</button></div>
    <form id="cargoForm" onsubmit="guardarCargo(event)" style="display:grid;gap:10px">
      <div><label for="cg_desc" id="cgDescLabel">¿Qué fue?</label><input id="cg_desc" required minlength="3" autocomplete="off"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label for="cg_monto">Precio (Lps)</label><input id="cg_monto" type="number" min="0" step="any" required style="font-weight:700"></div>
        <div><label for="cg_fecha">Fecha</label><input id="cg_fecha" type="date" required></div>
      </div>
      <label class="check"><input type="checkbox" id="cg_cobrar"> <span id="cgCobrarTxt">Lo paga el motorista</span></label>
      <div class="actions" style="margin-top:0">
        <button type="button" onclick="cerrar('ovCargo')">Cancelar</button>
        <button type="submit" class="primary" id="cgBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Día libre -->
<div class="overlay" id="ovLibre">
  <div class="modal chico">
    <div class="head"><h2>🌴 Días libres</h2><button class="small" onclick="cerrar('ovLibre')" aria-label="Cerrar">✕</button></div>
    <form id="libreForm" onsubmit="guardarDiaLibre(event)" style="display:grid;gap:10px">
      <div id="libreQuien" class="preview"></div>
      <div class="calmes">
        <button type="button" class="small" onclick="moverMesLibre(-1)" aria-label="Mes anterior">‹</button>
        <b id="lbMes"></b>
        <button type="button" class="small" onclick="moverMesLibre(1)" aria-label="Mes siguiente">›</button>
      </div>
      <div class="cal" id="lbCal" role="grid"></div>
      <div>
        <label>Marcar de una vez en este mes</label>
        <div class="rapidos" id="lbRapidos"></div>
      </div>
      <div id="libreAviso" class="preview"></div>
      <div class="actions" style="margin-top:0">
        <button type="button" onclick="cerrar('ovLibre')">Cancelar</button>
        <button type="submit" class="primary" id="lbBtn">Guardar días libres</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirmación -->
<div class="overlay" id="ovConfirm">
  <div class="modal chico">
    <h2 id="cTitulo">¿Confirmar?</h2>
    <div id="cTexto"></div>
    <div class="actions">
      <button id="cNo">Cancelar</button>
      <button id="cSi" class="primary">Sí, continuar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="comun.js"></script>
<script>
let data = [];
let filtro = 'activos';
let abiertoId = null;
const puedeEditar = true;   // solo se entra con la clave
let cargado = false, versionDatos = -1, sinTabla = false;

/* ---------- utilidades ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => 'Lps ' + (Math.round((n||0)*100)/100).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseF(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); }
function isoF(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtF(d){ if(typeof d==='string') d=parseF(d); return d.toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtCorta(d){ return d.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'}); }
function hoy(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
const difDias = (a,b) => Math.round((a-b)/86400000);
const plural = (n, s, p) => n + ' ' + (n===1 ? s : (p || s+'s'));
const nombreAuto = v => [marcaBonita(v.marca), v.modelo, v.anio].filter(Boolean).join(' ');

const COLORES = [['Blanco','#ffffff'],['Negro','#111111'],['Gris','#7d8088'],['Plata','#c7cad1'],['Rojo','#c62828'],['Vino','#6d1b2b'],
  ['Azul','#1e4fbf'],['Azul marino','#14213d'],['Celeste','#7cc4f0'],['Verde','#2e7d32'],['Beige','#d9c7a3'],['Café','#6b4423'],

const colorHex = n => { const c = COLORES.find(([k])=>k.toLowerCase()===String(n||'').trim().toLowerCase()); return c ? c[1] : null; };
const punto = n => { const h = colorHex(n); return h ? `<span class="punto" style="--c:${h}" aria-hidden="true"></span>` : ''; };
/* Si lo escrito coincide con un nombre conocido (sin importar mayúsculas), usa el nombre bien escrito */
function normalizar(texto, lista){
  const t = String(texto||'').trim(); if(!t) return t;
  const hit = lista.find(x=>x.toLowerCase()===t.toLowerCase());
  return hit || t.charAt(0).toUpperCase() + t.slice(1);
}
function marcaConocida(m){ return Object.keys(MODELOS).find(k=>k.toLowerCase()===String(m||'').trim().toLowerCase()); }
const marcaBonita = m => marcaConocida(m) || m;
/* Un dato está incompleto si tiene menos de 3 letras (por ejemplo "c" o "g") */
const incompleto = t => String(t||'').trim().length < 3;
/* ---------- cálculos ---------- */
function listaTarifas(v){
  const t = (Array.isArray(v.tarifas) && v.tarifas.length) ? v.tarifas.slice() : [{desde:v.fechaInicio, monto:+v.tarifa||0}];
  return t.sort((a,b)=>String(a.desde).localeCompare(String(b.desde)));
}
function tarifaEn(tarifas, d){
  const iso = isoF(d); let m = +tarifas[0].monto || 0;
  for(const t of tarifas) if(String(t.desde) <= iso) m = +t.monto || 0;
  return m;
}
/* Recorre día por día desde la entrega: cada día cobrable suma la tarifa.
   Los pagos se aplican en orden a los días más antiguos. */
function calc(v){
  const h = hoy(), ini = parseF(v.fechaInicio);
  const finalizado = v.estado === 'finalizado';
  const fin = finalizado && v.fechaFin ? parseF(v.fechaFin) : null;
  const limite = fin && fin < h ? fin : h;
  const tarifas = listaTarifas(v);
  const pagos = v.pagos || [];
  const pagado = pagos.reduce((s,p)=>s + (+p.monto||0), 0);
  const tope = addDays(h, 400);
  const libres = new Set(v.diasLibresFechas || []);   // fechas 'AAAA-MM-DD' en que no se cobra
  let cum = 0, devengado = 0, devAyer = 0, prox = null, proxFalta = 0, pagadoHasta = null, diasAtraso = 0, diasCobrados = 0;
  const dias = new Map(), diasDebe = [];
  for(let d = new Date(ini), guard = 0; guard < 6000; guard++, d = addDays(d,1)){
    const enPeriodo = d <= limite;
    if(!enPeriodo && (prox || fin || d > tope)) break;
    const cob = !libres.has(isoF(d));
    const m = cob ? tarifaEn(tarifas, d) : 0;
    const antes = cum; cum += m;
    if(enPeriodo){
      devengado += m; if(d < h) devAyer += m;
      if(cob) diasCobrados++;
      dias.set(isoF(d), {cob, m, antes, despues:cum});
    }
    if(cob && m > 0){
      if(cum <= pagado + 0.01) pagadoHasta = new Date(d);
      else {
        if(!prox){ prox = new Date(d); proxFalta = cum - Math.max(antes, pagado); }
        if(enPeriodo) diasDebe.push({f:new Date(d), falta: cum - Math.max(antes, pagado)});
        if(d < h) diasAtraso++;
      }
    }
  }
  const deuda = Math.max(0, devengado - pagado);
  const vencido = Math.max(0, devAyer - pagado);
  const aFavor = Math.max(0, pagado - devengado);
  let estado;
  if(finalizado) estado = deuda > 0.01 ? 'bad' : 'done';
  else if(vencido > 0.01) estado = 'bad';
  else if(deuda > 0.01) estado = 'warn';
  else estado = 'ok';
  // próximo pago: si debe algo, es hoy por todo lo que debe; si está al día, el siguiente día sin cubrir
  let proxFecha = null, proxMonto = 0;
  if(deuda > 0.01){ proxFecha = finalizado ? null : h; proxMonto = deuda; }
  else if(!finalizado && prox){ proxFecha = prox; proxMonto = proxFalta; }
  const ultimoPago = pagos.length ? pagos.map(p=>String(p.fecha)).sort().pop() : null;
  return {pagado, devengado, deuda, vencido, aFavor, estado, diasAtraso, diasCobrados, pagadoHasta, primerImpago: prox, diasDebe,
          proxFecha, proxMonto, tarifaHoy: tarifaEn(tarifas, h), libreHoy: libres.has(isoF(h)), libres, tarifas, dias, ini, fin, ultimoPago, h,
          cargosPend: (v.cargos||[]).filter(x=>x.cobrar && !x.pagado).reduce((t,x)=>t + (+x.monto||0), 0)};
}
/* Cuánto da el vehículo entre dos fechas (incluidas): suma la tarifa de cada día del alquiler
   y no cuenta los días libres. 'libres' permite pasar días marcados sin guardar. */
function ingresoRango(v, desde, hasta, libres){
  libres = libres || new Set(v.diasLibresFechas || []);
  const tarifas = listaTarifas(v), ini = v.fechaInicio;
  const fin = v.estado==='finalizado' && v.fechaFin ? v.fechaFin : null;
  let total = 0, bruto = 0, cobrables = 0, nLibres = 0;
  for(let d = new Date(desde); d <= hasta; d = addDays(d,1)){
    const iso = isoF(d);
    if(iso < ini || (fin && iso > fin)) continue;
    const m = tarifaEn(tarifas, d);
    bruto += m;
    if(libres.has(iso)) nLibres++; else { total += m; cobrables++; }
  }
  return {total, bruto, cobrables, nLibres, rebajado: bruto - total};
}
/* Cuánto te deben pagar por semana y por mes: el total sin días libres y el total rebajando
   los días libres marcados en ese período (semana o mes completo, a la tarifa de cada día). */
function seccionIngreso(v){
  const h = hoy(), lun = lunesDe(h), dom = addDays(lun, 6);
  const corta = d => d.toLocaleDateString('es',{day:'numeric', month:'short'});
  const nomMes = d => { const t = d.toLocaleDateString('es',{month:'long'}); return t.charAt(0).toUpperCase()+t.slice(1); };
  const filas = [['Esta semana', lun, dom, `${corta(lun)} – ${corta(dom)}`]];
  for(let i = 0; i < 2; i++){
    const a = new Date(h.getFullYear(), h.getMonth()+i, 1), b = new Date(h.getFullYear(), h.getMonth()+i+1, 0);
    filas.push([i ? 'Próximo mes' : 'Este mes', a, b, nomMes(a)]);
  }
  const vCompleto = {...v, fechaInicio:'0000-01-01', estado:'activo'};   // período completo, sin importar la fecha de entrega
  return `<div class="section"><h4>💰 Cuánto te deben pagar</h4>
    <div class="tablewrap"><table>
      <thead><tr><th>Período</th><th class="n">Sin días libres</th><th class="n">Días libres</th><th class="n">Con días libres</th></tr></thead>
      <tbody>${filas.map(([t, a, b, rango]) => {
        const r = ingresoRango(vCompleto, a, b);
        return `<tr><td><b>${t}</b><br><small style="color:var(--muted)">${rango} · ${plural(r.cobrables + r.nLibres,'día')}</small></td>
          <td class="n">${money(r.bruto)}</td>
          <td class="n">${r.nLibres ? `${r.nLibres} <small style="color:var(--muted)">(−${money(r.rebajado)})</small>` : '—'}</td>
          <td class="n"><b style="color:var(--ok)">${money(r.total)}</b></td></tr>`;
      }).join('')}</tbody>
    </table></div></div>`;
}
function estadoDia(c, d){
  const iso = isoF(d);
  if(d < c.ini || (c.fin && d > c.fin)) return 'na';
  const x = c.dias.get(iso);
  if(!x) return 'na';
  const esHoy = +d === +c.h;
  if(!x.cob) return 'libre';
  if(x.despues <= c.pagado + 0.01) return esHoy ? 'hoy pag' : 'pag';
  if(x.antes < c.pagado - 0.01) return esHoy ? 'hoy parc' : 'parc';
  return esHoy ? 'hoy' : 'deb';
}
function tiraDias(c, n){
  const NOMBRES = {pag:'pagado', parc:'pago parcial', deb:'sin pagar', libre:'día libre', na:'sin alquiler', hoy:'hoy, pendiente', 'hoy pag':'hoy, pagado', 'hoy parc':'hoy, pago parcial'};
  let html = '';
  for(let i = n-1; i >= 0; i--){
    const d = addDays(c.h, -i), e = estadoDia(c, d);
    html += `<i class="${e}" title="${fmtCorta(d)}: ${NOMBRES[e]}"></i>`;
  }
  return `<div class="dias" aria-label="Últimos ${n} días">${html}</div>`;
}
const LEYENDA = `<div class="leyenda"><span style="--c:var(--day-pag)">Pagado</span><span style="--c:var(--day-parc)">Parcial</span><span style="--c:var(--day-deb)">Sin pagar</span><span style="--c:var(--day-libre)">Día libre</span></div>`;
function chip(c){
  if(c.estado==='done') return '<span class="chip done">Finalizado ✓</span>';
  const n = c.diasDebe.length;
  if(c.deuda > 0.01) return `<span class="chip ${c.estado==='bad'?'bad':'warn'}">${n===1 && c.estado!=='bad' ? 'Debe hoy' : 'Debe '+plural(n,'día')}</span>`;
  return '<span class="chip ok">Al día</span>';
}
const colorDeuda = c => c.deuda > 0.01 ? (c.estado==='bad' ? 'var(--danger)' : 'var(--warn)') : 'var(--ok)';

/* ---------- render principal ---------- */
/* ---------- cobro de hoy ----------
   Cada día se suma la tarifa sola. Un conductor está "cubierto hoy" cuando lo pagado alcanza hasta hoy.
   Los pagos cubren primero los días más viejos, así que si debe días anteriores, pagar la tarifa de hoy
   cubre el día más viejo que debe. El panel se reinicia solo cada día porque todo se calcula por fecha. */
function renderHoy(activos, cobHoy, deudaTotal){
  const box = document.getElementById('hoy');
  if(!cargado || !activos.length){ box.hidden = true; return; }
  box.hidden = false;
  const esperado = activos.reduce((t,x)=>t + (x.c.libreHoy ? 0 : x.c.tarifaHoy), 0);
  const pendientes = activos.filter(x=>x.c.deuda > 0.01)
    .sort((a,b)=> b.c.diasDebe.length - a.c.diasDebe.length || String(a.v.nombre).localeCompare(String(b.v.nombre)));
  const cubiertos = activos.filter(x=>x.c.deuda <= 0.01);
  const pct = esperado > 0 ? Math.min(100, cobHoy / esperado * 100) : 0;
  const fecha = hoy().toLocaleDateString('es',{weekday:'long', day:'numeric', month:'long'});
  const fila = ({v,c}) => {
    const deHoy = c.libreHoy ? 0 : Math.min(c.tarifaHoy, c.deuda);
    const atrasado = c.deuda - deHoy;   // lo que debe de días anteriores
    return `<div class="hoy-fila">
      <div style="min-width:0">
        <div class="q" onclick="verDetalle('${v.id}')">${esc(v.nombre)} <span class="placa">${esc(v.placa)}</span></div>
        <div class="sub">Hoy: ${c.libreHoy ? '🌴 día libre' : money(deHoy)}${atrasado > 0.01 ? ` · <span style="color:var(--danger)">atrasado ${money(atrasado)} (${plural(c.diasDebe.filter(x=>+x.f!==+c.h).length,'día')})</span>` : ''}</div>
      </div>
      <div class="btns">
        <button class="small primary" onclick="abonar('${v.id}','dia')">${c.libreHoy?'💵 Abonar':'✓ Pagó hoy'} · ${money(c.tarifaHoy)}</button>
        <button class="small" onclick="diaLibre('${v.id}')">🌴 Días libres</button>
        ${atrasado > 0.01 ? `<button class="small" onclick="abonar('${v.id}',true)">Pagó todo · ${money(c.deuda)}</button>` : ''}
      </div>
    </div>`;
  };
  box.innerHTML = `
    <div class="cab"><h3>📅 Cobro de hoy</h3><span class="meta">${fecha[0].toUpperCase()+fecha.slice(1)}</span></div>
    <div class="barra" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="nums">
      <span>Cobrado hoy <b style="color:var(--ok)">${money(cobHoy)}</b> · tarifas del día <b>${money(esperado)}</b></span>
      <span>${cubiertos.length} de ${activos.length} al día${deudaTotal>0.01?` · deuda total <b style="color:var(--danger)">${money(deudaTotal)}</b>`:''}</span>
    </div>
    ${pendientes.length ? pendientes.map(fila).join('') : '<div class="listo">✅ Todos pagaron hoy.</div>'}
    ${cubiertos.length && pendientes.length ? `<details><summary>Ya pagaron hoy (${cubiertos.length})</summary>
      ${cubiertos.map(({v,c})=>`<div class="sub" style="padding:4px 0">${c.libreHoy?'🌴':'✓'} ${esc(v.nombre)} — ${c.libreHoy?'hoy es su día libre':'pagado hasta el '+(c.pagadoHasta?fmtF(c.pagadoHasta):'—')}</div>`).join('')}</details>` : ''}`;
}
function render(){
  const q = document.getElementById('buscar').value.trim().toLowerCase();
  const all = data.map(v=>({v, c:calc(v)}));
  const activos = all.filter(x=>x.v.estado!=='finalizado');
  const hIso = isoF(hoy());
  let cobHoy = 0;
  for(const v of data) for(const p of (v.pagos||[])) if(p.fecha===hIso) cobHoy += +p.monto||0;
  const deuda = all.reduce((t,x)=>t + x.c.deuda, 0);
  const deben = all.filter(x=>x.c.deuda>0.01).length;
  document.title = (deben ? `(${deben}) ` : '') + 'Mis Vehículos';
  renderHoy(activos, cobHoy, deuda);
  revisarRespaldo('vehiculos', data.length > 0, exportar);

  const el = document.getElementById('list');
  if(!cargado){ el.innerHTML = '<div class="empty">Cargando vehículos…</div>'; return; }
  if(sinTabla){ el.innerHTML = '<div class="empty">La base de datos de vehículos todavía no está creada.<br>Ejecuta el archivo <b>vehiculos.sql</b> en Supabase &gt; SQL Editor.</div>'; return; }
  if(!data.length){
    el.innerHTML = `<div class="empty">Aún no tienes vehículos alquilados.<br><br><button class="primary" onclick="abrirForm()">+ Registrar el primer alquiler</button></div>`;
    return;
  }
  const lista = all.filter(({v,c})=>{
    if(q){
      const txt = [v.nombre, v.placa, v.marca, v.modelo, v.color].join(' ').toLowerCase();
      if(!txt.includes(q) && !telCoincide(v.telefono, q)) return false;
    }
    if(filtro==='deben') return c.deuda > 0.01;
    if(filtro==='finalizados') return v.estado==='finalizado';
    return v.estado!=='finalizado';
  });
  const orden = {bad:0,warn:1,ok:2,done:3};
  lista.sort((a,b)=> orden[a.c.estado]-orden[b.c.estado] || b.c.deuda-a.c.deuda || String(a.v.nombre).localeCompare(String(b.v.nombre)));
  if(!lista.length){ el.innerHTML = '<div class="empty">No hay resultados con este filtro.</div>'; return; }
  el.innerHTML = lista.map(({v,c})=>`
    <div class="veh" onclick="verDetalle('${v.id}')">
      <div class="top">
        <div style="min-width:0"><h3>${esc(v.nombre)}</h3><div class="phone">📞 ${esc(formatoTel(v.telefono))}</div></div>
        ${chip(c)}
      </div>
      <div class="auto"><span aria-hidden="true">🚗</span><span class="nm">${esc(nombreAuto(v))}${v.color?' · '+punto(v.color)+esc(v.color):''}</span><span class="placa">${esc(v.placa)}</span></div>
      <div class="grid2">
        <span>Tarifa diaria</span><b>${money(c.tarifaHoy)}</b>
        ${c.aFavor>0.01?`<span>Saldo a favor</span><b style="color:var(--ok)">${money(c.aFavor)}</b>`
          :`<span>Debe</span><b style="color:${colorDeuda(c)}">${money(c.deuda)}</b>`}
        ${c.diasDebe.length?`<span>Días</span><b style="font-weight:600">${rangosDias(c.diasDebe)}</b>`:''}
        <span>Pagado hasta</span><b>${c.pagadoHasta?fmtF(c.pagadoHasta):'—'}</b>
        ${c.cargosPend>0.01?`<span>🔧 Daños/cargos</span><b style="color:var(--danger)">${money(c.cargosPend)}</b>`:''}
      </div>
      ${tiraDias(c, 14)}
      <div class="cardfoot">
        <span>Últimos 14 días</span>
        ${!(v.estado==='finalizado' && c.deuda<=0.01) ? `<span class="botones">
          <button class="small" onclick="event.stopPropagation();abonar('${v.id}')">💵 ${c.deuda>0.01?'Abonar':'Adelantar pago'}</button>
          ${v.estado!=='finalizado'?`<button class="small" onclick="event.stopPropagation();diaLibre('${v.id}')">🌴 Días libres</button>`:''}
          ${c.deuda>0.01?`<button class="small primary" onclick="event.stopPropagation();abonar('${v.id}',true)">✓ Pagó todo</button>`:''}
        </span>`:''}
      </div>
    </div>`).join('');
}
document.getElementById('filters').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on', x===b));
  render();
});

  console.error(e);
  if(claveRechazada(e)) return;
  toast(e && e.message ? e.message : 'No se pudo guardar. Revisa la conexión e inténtalo de nuevo.');
}
function reemplazar(v){ const i = data.findIndex(x=>x.id===v.id); if(i>=0) data[i]=v; else data.push(v); }

/* ---------- formulario ---------- */
const CAMPOS = ['id','nombre','documento','telefono','direccion','marca','modelo','color','placa','tarifa','fechaInicio'];
function abrirForm(id){
  const f = document.getElementById('vehForm');
  f.reset();
  const v = id ? data.find(x=>x.id===id) : null;
  document.getElementById('formTitle').textContent = v ? 'Editar alquiler' : 'Nuevo alquiler';
  if(v){
    for(const k of CAMPOS) if(f.elements[k]) f.elements[k].value = v[k] ?? '';
    f.elements.telefono.value = telParaForm(v.telefono);
    f.elements.tarifa.value = tarifaEn(listaTarifas(v), hoy());
  } else {
    f.elements.id.value = '';
    f.elements.fechaInicio.value = isoF(hoy());
    f.elements.tarifa.value = lsGet('vehiculos_tarifa') || '';
  }
  f.elements.tarifaDesde.value = isoF(hoy());
  f.elements.fechaInicio.disabled = false;
  document.getElementById('wrapDesde').hidden = true;
  f.dataset.tarifaOriginal = v ? f.elements.tarifa.value : '';
  preview();
  cerrar('ovDetalle');
  abrir('ovForm');
  // si el vehículo tiene datos incompletos, lleva directo al campo que falta
  const falta = v && ['marca','modelo','color'].find(k=>incompleto(v[k]));
  if(falta){ f.elements[falta].focus(); f.elements[falta].select(); } else f.elements.nombre.focus();
}
function leerForm(){
  const f = document.getElementById('vehForm'); const o = {};
  for(const k of CAMPOS) o[k] = String(f.elements[k].value).trim();
  o.tarifaDesde = f.elements.tarifaDesde.value;
  return o;
}
/* Arma la lista de tarifas: al editar, las anteriores a "desde" se conservan y desde esa fecha rige la nueva */
function construirTarifas(base, o){
  const tarifa = +o.tarifa;
  if(!base) return [{desde:o.fechaInicio, monto:tarifa}];
  const desde = o.tarifaDesde || isoF(hoy());
  let tarifas = listaTarifas(base);
  if(o.fechaInicio !== base.fechaInicio) tarifas[0] = {...tarifas[0], desde:o.fechaInicio};
  if(tarifa !== tarifaEn(tarifas, parseF(desde))){
    tarifas = tarifas.filter(t=>String(t.desde) < desde);
    tarifas.push({desde: tarifas.length ? desde : o.fechaInicio, monto:tarifa});
  }
  return tarifas;
}
/* "del 9 nov al 12 nov, 14 nov" — agrupa días seguidos */
function rangosDias(lista){
  const grupos = [];
  for(const x of lista){
    const g = grupos[grupos.length-1];
    if(g && difDias(x.f, g.hasta) === 1) g.hasta = x.f; else grupos.push({desde:x.f, hasta:x.f});
  }
  const corta = d => d.toLocaleDateString('es',{day:'numeric',month:'short'});
  return grupos.map(g => +g.desde === +g.hasta ? corta(g.desde) : `del ${corta(g.desde)} al ${corta(g.hasta)}`).join(', ');
}
function preview(){
  const f = document.getElementById('vehForm');

  el.innerHTML = `Paga <b>${money(o.tarifa)}</b> por día · <b>${money(o.tarifa*7)}</b> por semana · <b>${money(o.tarifa*30)}</b> por 30 días.<br>
    ${c.ini > c.h ? `Empieza a cobrarse el <b>${fmtF(c.ini)}</b>.`

    ${cambio?'<br><span style="color:var(--warn)">El cambio de tarifa no afecta los días anteriores a la fecha que elijas.</span>':''}`;
}
async function guardarVehiculo(e){
  e.preventDefault();

  o.telefono = formatoTel(o.telefono);

  for(const [k, nom] of [['marca','la marca'],['modelo','el modelo'],['color','el color']]){

  }
  o.tarifa = +o.tarifa;
  lsSet('vehiculos_tarifa', o.tarifa);
  const base = o.id ? data.find(x=>x.id===o.id) : null;
  const tarifas = construirTarifas(base, o); delete o.tarifaDesde;
  const v = base ? {...base, ...o, tarifas}
    : {...o, id: uid(), tarifas, pagos:[], estado:'activo', creado:new Date().toISOString()};

  try{

}

/* Botón 💬 para mandar otra vez el recibo de un pago anterior (con la cuenta de hoy) */
/* ---------- recibo / estado de cuenta en imagen (los mismos datos del mensaje de WhatsApp) ---------- */
function facturaVehiculo(v, pago){
  const c = calc(v), cargos = v.cargos || [];
  const pend = cargos.filter(x=>x.cobrar && !x.pagado);
  const desde = isoF(addDays(hoy(), -30));
  const mant = cargos.filter(x=>x.tipo==='mant' && !(x.cobrar && !x.pagado) && String(x.fecha) >= desde);
  const filas = [];
  if(pago) filas.push({t:'Pago recibido', nota:'Fecha del pago: ' + fmtF(pago.fecha) + (pago.nota ? ' · ' + pago.nota : ''), v:money(+pago.monto), fuerte:true, color:'ok'});
  filas.push({seccion:'Renta del vehículo'});
  filas.push({t:'Tarifa diaria', v:money(c.tarifaHoy)});
  filas.push({t:'Pagado hasta', v:c.pagadoHasta ? fmtF(c.pagadoHasta) : '—'});
  if(c.aFavor > 0.01) filas.push({t:'Saldo a favor', v:money(c.aFavor), color:'ok'});
  filas.push({t:'Debe por renta', nota: c.diasDebe.length ? plural(c.diasDebe.length,'día') + ': ' + rangosDias(c.diasDebe) : 'Sin días pendientes',
              v:money(c.deuda), color: c.deuda > 0.01 ? 'bad' : 'ok'});
  if(pend.length){
    filas.push({seccion:'Daños / cargos pendientes'});
    pend.forEach(x=>filas.push({t:x.desc, nota:fmtF(x.fecha), v:money(+x.monto), color:'bad'}));
  }
  if(mant.length){
    filas.push({seccion:'Mantenimiento reciente'});
    mant.forEach(x=>filas.push({t:x.desc, nota:fmtF(x.fecha) + (x.cobrar ? ' · pagado' : ' · por cuenta del dueño'), v:money(+x.monto)}));
  }
  const total = c.deuda + c.cargosPend;
  return {
    seccion:'Alquiler de vehículos', color:'#2f2fb8',
    titulo: pago ? 'RECIBO DE PAGO' : 'ESTADO DE CUENTA',
    numero: pago ? 'R-' + String(pago.id).slice(-6).toUpperCase() : 'EC-' + isoF(hoy()).replace(/-/g,''),
    fecha: pago ? parseF(pago.fecha) : hoy(),
    cliente: [['Cliente', v.nombre], ['Teléfono', formatoTel(v.telefono)], ...(v.documento ? [['DNI', v.documento]] : []),
              ['Vehículo', `${nombreAuto(v)}${v.color ? ' · ' + v.color : ''} · Placa ${v.placa}`]],
    filas, totalLabel:'Total pendiente', total:money(total),
    estado: total > 0.01 ? {texto:'SALDO PENDIENTE', ok:false} : {texto:'AL DÍA  ✓', ok:true},
    pie: pago ? '¡Gracias por su pago!' : 'Gracias por mantenerse al día.',
    tel: v.telefono,
    archivo: (pago ? 'recibo-' : 'estado-cuenta-') + String(v.placa||'vehiculo').replace(/\W/g,'') + '-' + (pago ? pago.fecha : isoF(hoy()))
  };
}
function facturaPago(vid, pid){
  const v = data.find(x=>x.id===vid); if(!v) return;

/* ---------- daños y mantenimiento ----------
   Cada registro: {id, tipo:'dano'|'mant', fecha, desc, monto, cobrar (lo paga el motorista), pagado, fechaPago}.
   Lo que paga el motorista queda "pendiente" hasta marcarlo pagado. No se mezcla con la tarifa diaria. */
const TIPOS_CARGO = {
  dano: {titulo:'🚗💥 Daño del vehículo', icono:'💥', nombre:'Daño', cobrar:true, pregunta:'¿Qué se dañó?'},
  mant: {titulo:'🔧 Mantenimiento', icono:'🔧', nombre:'Mantenimiento', cobrar:false, pregunta:'¿Qué se le hizo?'}
};
let cargoCtx = null;
function nuevoCargo(id, tipo){
  const t = TIPOS_CARGO[tipo]; cargoCtx = {id, tipo};

  document.getElementById('cgDescLabel').textContent = t.pregunta;
  document.getElementById('cg_desc').value = '';

async function guardarCargo(e){
  e.preventDefault();

  const desc = document.getElementById('cg_desc').value.trim();
  if(desc.length < 3){ toast('Escribe qué fue (por ejemplo: Parachoques).'); return; }
  const cargo = {id:uid(), tipo:cargoCtx.tipo, fecha:document.getElementById('cg_fecha').value, desc: desc.charAt(0).toUpperCase()+desc.slice(1),
                 monto:+document.getElementById('cg_monto').value||0, cobrar:document.getElementById('cg_cobrar').checked, pagado:false};
  const v = {...base, cargos:[...(base.cargos||[]), cargo]};
  const btn = document.getElementById('cgBtn'); btn.disabled = true;
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(v.id); cerrar('ovCargo'); toast(TIPOS_CARGO[cargo.tipo].nombre + ' guardado'); }
  catch(err){ errorGuardar(err); }
  finally{ btn.disabled = false; }
}
async function cambiarCargo(vid, cid, cambio){
  const base = data.find(x=>x.id===vid); if(!base) return;
  const cg = (base.cargos||[]).find(x=>x.id===cid); if(!cg) return;
  if(cambio==='borrar' && !await confirmar('Borrar registro', `¿Borrar "${esc(cg.desc)}" (${money(+cg.monto)})?`, 'Borrar')) return;
  if(cambio==='pagado' && !await confirmar('Marcar pagado', `¿${esc(base.nombre)} pagó "${esc(cg.desc)}" por ${money(+cg.monto)}?`, 'Sí, pagó')) return;
  const cargos = cambio==='borrar' ? base.cargos.filter(x=>x.id!==cid)
    : base.cargos.map(x=>x.id!==cid ? x : (cambio==='pagado' ? {...x, pagado:true, fechaPago:isoF(hoy())} : {...x, pagado:false, fechaPago:undefined}));
  const v = {...base, cargos};
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(vid); toast(cambio==='borrar'?'Registro borrado':cambio==='pagado'?'Marcado como pagado':'Marcado como pendiente'); }
  catch(err){ errorGuardar(err); }
}

/* Texto para el recordatorio de WhatsApp: daños pendientes + mantenimiento de los últimos 30 días */
function textoCargosWhatsApp(v, yaDebe){
  const cargos = v.cargos || [];
  const pend = cargos.filter(x=>x.cobrar && !x.pagado);
  const desde = isoF(addDays(hoy(), -30));
  const mant = cargos.filter(x=>x.tipo==='mant' && !(x.cobrar && !x.pagado) && String(x.fecha) >= desde);
  let t = '';
  if(pend.length){
    const total = pend.reduce((s,x)=>s + (+x.monto||0), 0);
    t += `${yaDebe?'Además tienes':'Tienes'} pendiente por daños/cargos ${money(total)}: ` + pend.map(x=>`${x.desc} ${money(+x.monto)} (${fmtF(x.fecha)})`).join('; ') + '. ';
  }
  if(mant.length) t += `Mantenimiento reciente del vehículo: ` + mant.map(x=>`${x.desc} ${money(+x.monto)} (${fmtF(x.fecha)})`).join('; ') + '. ';
  return t;
}

/* ---------- día libre: un día (el que sea) en que no se cobra la tarifa ---------- */
let libreId = null;
const lunesDe = d => addDays(d, -((d.getDay()+6)%7));   // semana de lunes a domingo
/* Calendario del mes: se tocan los días para marcarlos/desmarcarlos y se guarda todo junto */
let libreSel = new Set(), libreMes = null;
const NOM_DIAS = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function diaLibre(id){
  const v = data.find(x=>x.id===id); if(!v) return;
  libreId = id;
  const c = calc(v);
  libreSel = new Set(v.diasLibresFechas || []);
  const h = hoy();
  libreMes = new Date(h.getFullYear(), h.getMonth(), 1);
  document.getElementById('libreQuien').innerHTML = `<b>${esc(v.nombre)}</b> · ${esc(nombreAuto(v))} <span class="placa">${esc(v.placa)}</span><br>Toca los días que le das libre: esos días no se le cobra la tarifa de ${money(c.tarifaHoy)}.`;
  pintarCalLibre();
  abrir('ovLibre');
}
function moverMesLibre(n){ libreMes = new Date(libreMes.getFullYear(), libreMes.getMonth()+n, 1); pintarCalLibre(); }
/* Días del mes que se pueden marcar (dentro del alquiler) */
function diasMesLibre(v){
  const out = [], fin = v.estado==='finalizado' && v.fechaFin ? v.fechaFin : null;
  for(let d = new Date(libreMes); d.getMonth() === libreMes.getMonth(); d = addDays(d,1)){
    const iso = isoF(d);
    out.push({d, iso, ok: iso >= v.fechaInicio && (!fin || iso <= fin)});
  }
  return out;
}
function pintarCalLibre(){
  const v = data.find(x=>x.id===libreId); if(!v) return;
  const c = calc(v), h = hoy();
  const tMes = libreMes.toLocaleDateString('es',{month:'long', year:'numeric'});
  document.getElementById('lbMes').textContent = tMes.charAt(0).toUpperCase() + tMes.slice(1);
  const dias = diasMesLibre(v);
  let html = ['L','M','M','J','V','S','D'].map(x=>`<div class="dn">${x}</div>`).join('');
  html += '<div></div>'.repeat((libreMes.getDay()+6)%7);
  for(const {d, iso, ok} of dias){
    const est = ok ? estadoDia(c, d) : 'na';
    const cls = [libreSel.has(iso)?'on':'', +d===+h?'hoy':'', /pag/.test(est)&&!/parc/.test(est)?'pag':'', est==='deb'?'deb':''].join(' ');
    html += `<button type="button" class="${cls}" ${ok?'':'disabled'} aria-pressed="${libreSel.has(iso)}" data-iso="${iso}"
      title="${d.toLocaleDateString('es',{weekday:'long', day:'numeric', month:'long'})}">${d.getDate()}</button>`;
  }
  const cal = document.getElementById('lbCal');
  cal.innerHTML = html;
  cal.querySelectorAll('button[data-iso]').forEach(b => b.onclick = () => {
    const iso = b.dataset.iso;
    libreSel.has(iso) ? libreSel.delete(iso) : libreSel.add(iso);
    pintarCalLibre();
  });
  // botones para marcar de una vez: todos los domingos, sábados, etc. del mes (si ya están todos, los quita)
  document.getElementById('lbRapidos').innerHTML = [6,5,0,1,2,3,4].map(i => {
    const delDia = dias.filter(x => x.ok && (x.d.getDay()+6)%7 === i);
    if(!delDia.length) return '';
    const todos = delDia.every(x => libreSel.has(x.iso));
    return `<button type="button" class="${todos?'primary':''}" data-wd="${i}">${todos?'✓ ':''}Todos los ${NOM_DIAS[i]}${/s$/.test(NOM_DIAS[i])?'':'s'}</button>`;
  }).join('') + (dias.some(x=>x.ok && libreSel.has(x.iso)) ? '<button type="button" data-wd="x">Limpiar mes</button>' : '');
  document.querySelectorAll('#lbRapidos button').forEach(b => b.onclick = () => {
    const wd = b.dataset.wd;
    if(wd === 'x'){ dias.forEach(x => libreSel.delete(x.iso)); pintarCalLibre(); return; }
    const delDia = dias.filter(x => x.ok && (x.d.getDay()+6)%7 === +wd);
    const todos = delDia.every(x => libreSel.has(x.iso));
    delDia.forEach(x => todos ? libreSel.delete(x.iso) : libreSel.add(x.iso));
    pintarCalLibre();
  });
  // resumen de cambios
  const antes = new Set(v.diasLibresFechas || []);
  const nuevos = [...libreSel].filter(f => !antes.has(f)), quitados = [...antes].filter(f => !libreSel.has(f));
  const enMes = dias.filter(x => libreSel.has(x.iso));
  const ahorro = enMes.reduce((t,x) => t + tarifaEn(c.tarifas, x.d), 0);
  document.getElementById('libreAviso').innerHTML =
    `<b>${enMes.length}</b> día${enMes.length===1?'':'s'} libre${enMes.length===1?'':'s'} en ${libreMes.toLocaleDateString('es',{month:'long'})}` +
    (enMes.length ? ` · no se le cobran <b>${money(ahorro)}</b>` : '') +
    `<br>Este mes te da <b style="color:var(--ok)">${money(ingresoRango(v, libreMes, new Date(libreMes.getFullYear(), libreMes.getMonth()+1, 0), libreSel).total)}</b>` +
    (nuevos.length || quitados.length ? `<br><span style="color:var(--warn)">Sin guardar: ${nuevos.length ? `+${nuevos.length} marcado${nuevos.length===1?'':'s'}` : ''}${nuevos.length && quitados.length ? ', ' : ''}${quitados.length ? `${quitados.length} quitado${quitados.length===1?'':'s'}` : ''}</span>` : '');
  document.getElementById('lbBtn').disabled = !nuevos.length && !quitados.length;
}
async function guardarDiaLibre(e){
  e.preventDefault();
  const base = data.find(x=>x.id===libreId); if(!base) return;
  const antes = new Set(base.diasLibresFechas || []);
  const nuevos = [...libreSel].filter(f => !antes.has(f)).length, quitados = [...antes].filter(f => !libreSel.has(f)).length;
  const v = {...base, diasLibresFechas: [...libreSel].sort()};
  if(!v.diasLibresFechas.length) delete v.diasLibresFechas;
  const btn = document.getElementById('lbBtn'); btn.disabled = true;
  try{
    await guardarDoc(v); reemplazar(v); render();
    if(document.getElementById('ovDetalle').classList.contains('open')) verDetalle(v.id);
    cerrar('ovLibre');
    toast('🌴 Días libres guardados' + (nuevos ? ` · ${nuevos} nuevo${nuevos===1?'':'s'}` : '') + (quitados ? ` · ${quitados} quitado${quitados===1?'':'s'}` : ''));
  }catch(err){ errorGuardar(err); btn.disabled = false; }
}
async function quitarDiaLibre(id, fecha){
  const base = data.find(x=>x.id===id); if(!base) return;
  if(!await confirmar('Quitar día libre', `¿Volver a cobrar el ${parseF(fecha).toLocaleDateString('es',{weekday:'long', day:'numeric', month:'long'})} a <b>${esc(base.nombre)}</b>?`, 'Quitar')) return;
  const v = {...base, diasLibresFechas: (base.diasLibresFechas||[]).filter(f=>f!==fecha)};
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(id); toast('Día libre quitado'); }
  catch(err){ errorGuardar(err); }
}

/* Abre la ventana de abono. Con "todo" viene lleno con la deuda completa. */
function abonar(id, todo){
  const v = data.find(x=>x.id===id); if(!v) return;
  const c = calc(v), debe = c.deuda > 0.01;
  const despues = m => calc({...v, pagos:[...(v.pagos||[]), {monto:m}]});
  const estadoTxt = c2 => c2.deuda > 0.01
    ? `Queda debiendo <b style="color:var(--danger)">${money(c2.deuda)}</b> de ${plural(c2.diasDebe.length,'día')}: ${rangosDias(c2.diasDebe)}.`
    : `<span style="color:var(--ok)">✓ Queda al día</span>${c2.pagadoHasta?`, pagado hasta el <b>${fmtF(c2.pagadoHasta)}</b>`:''}${c2.aFavor>0.01?` · saldo a favor <b>${money(c2.aFavor)}</b>`:''}.`;
  abrirAbono({
    titulo: debe ? 'Abonar a la deuda' : 'Adelantar pago',
    resumen: `<b>${esc(v.nombre)}</b> · ${esc(nombreAuto(v))} <span class="placa">${esc(v.placa)}</span><br>` +
      (debe ? `Debe <b style="color:var(--danger)">${money(c.deuda)}</b> de ${plural(c.diasDebe.length,'día')}: ${rangosDias(c.diasDebe)}.`
            : `<span style="color:var(--ok)">No debe nada</span>${c.pagadoHasta?` · pagado hasta el ${fmtF(c.pagadoHasta)}`:''}.`),
    rapidos: debe
      ? [[`Todo · ${money(c.deuda)}`, c.deuda], ...(c.deuda > c.tarifaHoy*2 ? [[`La mitad · ${money(c.deuda/2)}`, c.deuda/2]] : []), [`1 día · ${money(c.tarifaHoy)}`, c.tarifaHoy]]
      : [[`1 día · ${money(c.tarifaHoy)}`, c.tarifaHoy], [`1 semana · ${money(c.tarifaHoy*7)}`, c.tarifaHoy*7]],
    montoInicial: todo === 'dia' ? c.tarifaHoy : todo ? c.deuda : 0,
    previsualizar: m => 'Después del abono: ' + estadoTxt(despues(m)),
    guardar: (m, fecha, nota) => registrarPago(id, m, fecha, nota),
    recibo: (m, fecha) => {
      const c2 = calc(data.find(x=>x.id===id));
      return {
        tel: v.telefono,
        factura: (()=>{ const vv = data.find(x=>x.id===id); return facturaVehiculo(vv, (vv.pagos||[]).at(-1)); })(),
        resumen: `Abono de <b>${money(m)}</b> de ${esc(v.nombre)}.<br>${estadoTxt(c2)}`,
        texto: `Hola ${v.nombre}, recibí tu pago de ${money(m)} el ${fmtF(fecha)} por el vehículo ${nombreAuto(v)} (placa ${v.placa}). ` +
          (c2.deuda > 0.01 ? `Saldo pendiente: ${money(c2.deuda)} (${rangosDias(c2.diasDebe)}).`
                           : `Quedas al día${c2.pagadoHasta?` hasta el ${fmtF(c2.pagadoHasta)}`:''}${c2.aFavor>0.01?`, con ${money(c2.aFavor)} a favor`:''}.`) +
          ' ¡Gracias!'
      };
    }
  });
}
async function borrarPago(pid){
  if(!await confirmar('Borrar pago','¿Seguro que quieres borrar este pago?','Borrar')) return;
  const base = data.find(x=>x.id===abiertoId); if(!base) return;
  const v = {...base, pagos:(base.pagos||[]).filter(p=>p.id!==pid)};
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(v.id); toast('Pago borrado'); }
  catch(err){ errorGuardar(err); }
}
async function finalizar(id){
  const base = data.find(x=>x.id===id); if(!base) return;
  if(!await confirmar('Finalizar alquiler', `¿El vehículo fue devuelto hoy (${fmtF(hoy())})? Desde mañana ya no se cobrará la tarifa a <b>${esc(base.nombre)}</b>.`, 'Finalizar')) return;
  const v = {...base, estado:'finalizado', fechaFin:isoF(hoy())};
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(id); toast('Alquiler finalizado'); }
  catch(err){ errorGuardar(err); }
}
async function reactivar(id){
  const base = data.find(x=>x.id===id); if(!base) return;
  if(!await confirmar('Reactivar alquiler', 'Se volverá a cobrar la tarifa diaria, incluidos los días desde que se finalizó. ¿Continuar?', 'Reactivar')) return;
  const v = {...base, estado:'activo'}; delete v.fechaFin;
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(id); toast('Alquiler reactivado'); }
  catch(err){ errorGuardar(err); }
}
async function borrarVehiculo(id){
  const v = data.find(x=>x.id===id); if(!v) return;
  if(!await confirmar('Eliminar alquiler',`¿Eliminar el alquiler de <b>${esc(v.nombre)}</b> (${esc(v.placa)}) con todos sus pagos? Esta acción no se puede deshacer.`,'Eliminar')) return;
  try{
    await rpc('borrar_vehiculo', {p_clave:clave||'', p_id:id});
    data = data.filter(x=>x.id!==id);
    cerrar('ovDetalle'); render(); toast('Alquiler eliminado');
  }catch(err){ errorGuardar(err); }
}

/* ---------- respaldo ---------- */
function exportar(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo-vehiculos-' + isoF(hoy()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  marcarRespaldo('vehiculos');
  toast('Copia de seguridad descargada');
}
async function importar(e){
  const file = e.target.files[0]; e.target.value=''; if(!file) return;
  let d;
  try{ d = JSON.parse(await file.text()); if(!Array.isArray(d)) throw 0; }
  catch(err){ toast('El archivo no es un respaldo válido.'); return; }
  if(!await confirmar('Restaurar respaldo',`Se cargarán <b>${d.length}</b> alquileres y se reemplazarán los que hay ahora (${data.length}). ¿Continuar?`,'Restaurar')) return;
  toast('Cargando respaldo…');
  try{
    const nuevos = d.map(v=>({...v, id: (v.id && /^[A-Za-z0-9_\-]{1,64}$/.test(v.id)) ? v.id : uid(), pagos: v.pagos||[]}));
    await rpc('restaurar_vehiculos', {p_clave:clave||'', p_lista:nuevos});
    data = nuevos; render(); toast(`Respaldo restaurado: ${nuevos.length} alquileres`);
  }catch(err){ errorGuardar(err); }
}

/* ---------- modales ---------- */
function abrir(id){ document.getElementById(id).classList.add('open'); }
function cerrar(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('mousedown', e=>{ if(e.target===o && o.id!=='ovConfirm') o.classList.remove('open'); }));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay.open').forEach(o=>{ if(o.id==='ovConfirm') document.getElementById('cNo').click(); else o.classList.remove('open'); }); });
function confirmar(titulo, html, si){
  return new Promise(res=>{
    document.getElementById('cTitulo').textContent = titulo;
    document.getElementById('cTexto').innerHTML = html;
    const bSi = document.getElementById('cSi'), bNo = document.getElementById('cNo');
    bSi.textContent = si || 'Sí, continuar';
    const fin = v => { cerrar('ovConfirm'); bSi.onclick = bNo.onclick = null; res(v); };
    bSi.onclick = () => fin(true); bNo.onclick = () => fin(false);
    abrir('ovConfirm'); bNo.focus();
  });
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }
function aviso(t){ const el=document.getElementById('aviso'); el.hidden=!t; el.textContent=t||''; }
/* ---------- carga de datos (se actualiza sola cada 10 segundos) ---------- */
async function cargar(){
  try{
    const filas = await leerFilas('vehiculos');
    sinTabla = false;
    aviso('');
    const firma = filas.map(f=>f.id+'@'+f.actualizado).join('|');
    if(firma === versionDatos && cargado) return;
    versionDatos = firma; data = filas.map(f=>({...f.datos, id:f.id})); cargado = true;
    render();
    const ov = document.getElementById('ovDetalle');
    if(ov.classList.contains('open') && abiertoId) verDetalle(abiertoId);
  }catch(e){
    if(claveRechazada(e)) return;
    if(e && e.status===404){ sinTabla = true; cargado = true; aviso(''); render(); return; }
    aviso(cargado ? 'Sin conexión: los datos pueden no estar actualizados.' : 'No se pudo conectar con la base de datos. Revisa tu conexión a internet.');
  }
}
prepararCampoTel(document.getElementById('f_tel'));
montarMenu('menuMas', [
  ['⬇ Descargar copia de seguridad', exportar],
  ['⬆ Restaurar copia de seguridad', () => document.getElementById('fileImport').click()],
  ['🕘 Copias automáticas', () => verCopiasAuto('vehiculos')],
  ['🔓 Salir en este dispositivo', () => salir()]
]);
iniciarAcceso('Mis Vehículos', async () => {
  render();
  await cargar();
  setInterval(cargar, 10000);
  setInterval(render, 60*60*1000);
});
</script>
