<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mis Vehículos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#3438c9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Alquiler diario de vehículos: misma estructura que Préstamos, en tono índigo */
:root{
  --bg:#f2f3fa; --card:#ffffff; --text:#191c33; --muted:#636884; --line:#dfe1ee; --soft:#eceefa;
  --primary:#3438c9; --primary-2:#5b62f0; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.16);
  --danger:#c0392b; --warn:#b7700a; --ok:#1e8e4e;
  --chip-ok:#e3f5ea; --chip-warn:#fdf0dc; --chip-bad:#fbe5e2; --chip-done:#e7e8f0;
  --day-pag:#2fa866; --day-parc:#e9a23b; --day-deb:#dc4a3a; --day-hoy:#9aa0c4; --day-libre:#d6d9ea;
  --shadow:0 1px 3px rgba(20,24,60,.08); --scrim:rgba(10,12,30,.5); --toast:#191c33; --toast-text:#fff;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1020; --card:#181a2e; --text:#e6e8f5; --muted:#9a9fbd; --line:#2a2d48; --soft:#21233b;
    --primary:#2a2d9a; --primary-2:#8c92ff; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.12);
    --danger:#ef6b5b; --warn:#f0a93b; --ok:#4cc77f;
    --chip-ok:#1d3a2a; --chip-warn:#3d2f17; --chip-bad:#42201c; --chip-done:#272a40;
    --day-pag:#3fbf78; --day-parc:#e9a23b; --day-deb:#ef6b5b; --day-hoy:#5d6285; --day-libre:#2e3150;
    --shadow:none; --scrim:rgba(0,0,0,.6); --toast:#e6e8f5; --toast-text:#0f1020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1020; --card:#181a2e; --text:#e6e8f5; --muted:#9a9fbd; --line:#2a2d48; --soft:#21233b;
  --primary:#2a2d9a; --primary-2:#8c92ff; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.12);
  --danger:#ef6b5b; --warn:#f0a93b; --ok:#4cc77f;
  --chip-ok:#1d3a2a; --chip-warn:#3d2f17; --chip-bad:#42201c; --chip-done:#272a40;
  --day-pag:#3fbf78; --day-parc:#e9a23b; --day-deb:#ef6b5b; --day-hoy:#5d6285; --day-libre:#2e3150;
  --shadow:none; --scrim:rgba(0,0,0,.6); --toast:#e6e8f5; --toast-text:#0f1020;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1100px;margin:0 auto}
header{background:var(--primary);color:var(--on-primary);padding-block:14px}
header .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:21px;flex:1;min-width:150px}
main{padding-block:16px 40px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px}
button:hover{filter:brightness(.97)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
header button{background:var(--head-btn);border-color:rgba(255,255,255,.3);color:var(--on-primary)}
header button.primary{background:var(--on-primary);color:var(--primary);border-color:var(--on-primary);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.small{padding:4px 10px;font-size:13px}
a.btn{display:inline-block;text-decoration:none;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px}
a.inicio{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--head-btn);border:1px solid rgba(255,255,255,.3);color:var(--on-primary);text-decoration:none;font-size:18px;font-weight:700}
.aviso{background:var(--chip-warn);color:var(--text);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:100%}
textarea{resize:vertical;min-height:60px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.veh{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer;min-width:0;display:flex;flex-direction:column}
.veh:hover{border-color:var(--primary-2)}
.veh .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.veh h3{margin:0;font-size:17px}
.phone{color:var(--muted);font-size:13px}
.auto{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:14px;min-width:0}
.auto .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placa{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:700;font-size:12px;letter-spacing:.06em;border:1.5px solid currentColor;border-radius:5px;padding:1px 6px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.grid2 span{color:var(--muted)}
.grid2 b{font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.chip.ok{background:var(--chip-ok);color:var(--ok)}
.chip.warn{background:var(--chip-warn);color:var(--warn)}
.chip.bad{background:var(--chip-bad);color:var(--danger)}
.chip.done{background:var(--chip-done);color:var(--muted)}
.dias{display:flex;gap:3px;margin-top:12px}
.dias i{flex:1;height:8px;border-radius:3px;background:var(--day-hoy)}
.dias i.pag{background:var(--day-pag)} .dias i.parc{background:var(--day-parc)} .dias i.deb{background:var(--day-deb)}
.dias i.libre{background:var(--day-libre)} .dias i.na{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.dias i.hoy{background:transparent;outline:1.5px solid var(--day-hoy);outline-offset:-1.5px}
.dias i.hoy.pag{background:var(--day-pag);outline:none}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.cardfoot .botones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;
  padding:max(20px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 20px max(12px, env(safe-area-inset-left, 0px));overflow:auto;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:760px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);min-width:0}
.modal.chico{max-width:420px}
.modal h2{margin:0 0 12px;font-size:19px}
.modal .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form h4{grid-column:1/-1;margin:10px 0 0;font-size:15px;padding-top:10px;border-top:1px solid var(--line)}
.form h4:first-of-type{border-top:0;padding-top:0;margin-top:0}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.preview{grid-column:1/-1;background:var(--soft);border-radius:8px;padding:10px;font-size:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.section{margin-top:18px}
.section h4{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.info div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.info span{display:block;font-size:12px;color:var(--muted)}
.info span.placa,.info span.punto{display:inline-block;color:inherit;font-size:12px}
.punto{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);border:1px solid rgba(128,128,128,.55);vertical-align:-1px;margin-right:5px;flex:none}
.colores{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.colores button{display:flex;align-items:center;gap:4px;padding:4px 9px;font-size:13px;border-radius:20px}
.colores button.on{border-color:var(--primary-2);outline:2px solid var(--primary-2);outline-offset:-1px}
.info b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.destacado{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.destacado div{border:1px solid var(--line);border-radius:10px;padding:12px}
.destacado span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.destacado b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.destacado small{color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:var(--toast);color:var(--toast-text);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:600px){
  .form{grid-template-columns:1fr}
  .list{grid-template-columns:1fr}
}
</style>

<header>
  <div class="wrap gut">
    <a class="inicio" href="./" title="Volver al inicio" aria-label="Volver al inicio">←</a>
    <h1>Mis Vehículos</h1>
    <div id="menuMas"></div>
    <input type="file" id="fileImport" accept=".json,application/json" hidden onchange="importar(event)">
    <button class="primary" id="btnNuevo" onclick="abrirForm()">+ Nuevo alquiler</button>
  </div>
</header>

<main class="wrap gut">
  <div class="aviso" id="aviso" hidden></div>
  <div id="respaldoAviso" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input id="buscar" placeholder="Buscar por conductor, teléfono, placa o modelo..." oninput="render()">
    <div class="filters" id="filters">
      <button data-f="activos" class="on">Activos</button>
      <button data-f="deben">Deben</button>
      <button data-f="finalizados">Finalizados</button>
    </div>
  </div>
  <div class="list" id="list"><div class="empty">Cargando vehículos…</div></div>
</main>

<!-- Formulario alquiler -->
<div class="overlay" id="ovForm">
  <div class="modal">
    <div class="head"><h2 id="formTitle">Nuevo alquiler</h2><button class="small" onclick="cerrar('ovForm')" aria-label="Cerrar">✕</button></div>
    <form class="form" id="vehForm" onsubmit="guardarVehiculo(event)">
      <input type="hidden" name="id">
      <h4>👤 Conductor</h4>
      <div class="full"><label for="f_nombre">Nombre completo *</label><input name="nombre" id="f_nombre" required autocomplete="off"></div>
      <div><label for="f_doc">No. de DNI *</label><input name="documento" id="f_doc" required inputmode="numeric" autocomplete="off"></div>
      <div><label for="f_tel">Número de teléfono *</label><input name="telefono" id="f_tel" type="tel" required autocomplete="off"></div>
      <div class="full"><label for="f_dir">Dirección completa *</label><input name="direccion" id="f_dir" required autocomplete="off"></div>

      <h4>🚗 Vehículo</h4>
      <div><label for="f_marca">Marca *</label><input name="marca" id="f_marca" required placeholder="Escribe o elige: Toyota" list="dl_marcas" autocomplete="off" oninput="actualizarModelos()"></div>
      <div><label for="f_modelo">Modelo *</label><input name="modelo" id="f_modelo" required placeholder="Escribe o elige: Corolla" list="dl_modelos" autocomplete="off"></div>
      <div class="full"><label for="f_color">Color *</label><input name="color" id="f_color" required placeholder="Elige un color o escríbelo" autocomplete="off" oninput="marcarColor()">
        <div class="colores" id="colores"></div></div>
      <datalist id="dl_marcas"></datalist><datalist id="dl_modelos"></datalist>
      <div><label for="f_placa">Placa *</label><input name="placa" id="f_placa" required style="text-transform:uppercase"></div>

      <h4>💵 Tarifa diaria</h4>
      <div><label for="f_tarifa">Cuánto paga por día *</label><input name="tarifa" id="f_tarifa" type="number" min="1" step="any" required oninput="preview()"></div>
      <div><label for="f_ini">Cobrar desde el día *</label><input name="fechaInicio" id="f_ini" type="date" required oninput="preview()"></div>
      <div id="wrapDesde" hidden><label for="f_desde">La nueva tarifa aplica desde</label><input name="tarifaDesde" id="f_desde" type="date" oninput="preview()"></div>
      <div class="preview" id="preview">Escribe la tarifa para ver el cálculo.</div>
      <div class="full actions">
        <button type="button" onclick="cerrar('ovForm')">Cancelar</button>
        <button type="submit" class="primary" id="btnGuardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Detalle -->
<div class="overlay" id="ovDetalle"><div class="modal" id="detalle"></div></div>

<!-- Confirmación -->
<div class="overlay" id="ovConfirm">
  <div class="modal chico">
    <h2 id="cTitulo">¿Confirmar?</h2>
    <div id="cTexto"></div>
    <div class="actions">
      <button id="cNo">Cancelar</button>
      <button id="cSi" class="primary">Sí, continuar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="comun.js"></script>
<script>
let data = [];
let filtro = 'activos';
let abiertoId = null;
const puedeEditar = true;   // solo se entra con la clave
let cargado = false, versionDatos = -1, sinTabla = false;

/* ---------- utilidades ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => 'Lps ' + (Math.round((n||0)*100)/100).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseF(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); }
function isoF(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtF(d){ if(typeof d==='string') d=parseF(d); return d.toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtCorta(d){ return d.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'}); }
function hoy(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
const difDias = (a,b) => Math.round((a-b)/86400000);
const plural = (n, s, p) => n + ' ' + (n===1 ? s : (p || s+'s'));
const nombreAuto = v => [v.marca, v.modelo, v.anio].filter(Boolean).join(' ');
const MODELOS = {
  'Toyota':['Corolla','Yaris','Camry','Prius','Hilux','RAV4','Rush','Avanza','Fortuner','Land Cruiser Prado','Hiace'],
  'Hyundai':['Accent','Elantra','Grand i10','i10','Sonata','Creta','Kona','Tucson','Santa Fe','Venue','H1'],
  'Kia':['Rio','Picanto','Soluto','Forte','K5','Soul','Seltos','Sportage','Sorento'],
  'Nissan':['Versa','Sentra','March','Note','Tiida','Almera','Kicks','X-Trail','Frontier'],
  'Honda':['Civic','City','Fit','Accord','HR-V','CR-V','Pilot'],
  'Mazda':['Mazda 2','Mazda 3','Mazda 6','CX-3','CX-30','CX-5','BT-50'],
  'Mitsubishi':['Mirage','Mirage G4','Lancer','Attrage','ASX','Outlander','Montero Sport','L200'],
  'Suzuki':['Swift','Dzire','Alto','Celerio','Ciaz','Ertiga','Vitara','Jimny'],
  'Chevrolet':['Spark','Beat','Aveo','Sail','Onix','Cruze','Tracker','Captiva','Colorado'],
  'Ford':['Fiesta','Focus','Figo','EcoSport','Escape','Explorer','Ranger'],
  'Volkswagen':['Gol','Polo','Virtus','Jetta','T-Cross','Tiguan','Amarok'],
  'Isuzu':['D-Max','MU-X'],
  'Renault':['Kwid','Logan','Sandero','Stepway','Duster','Koleos'],
  'Chery':['Arrizo 5','Tiggo 2','Tiggo 4','Tiggo 7'],
  'Changan':['Alsvin','CS15','CS35','CS55'],
  'Geely':['Emgrand','Coolray','Okavango'],
  'JAC':['J7','JS2','JS4','T6'],
  'BYD':['Dolphin','Dolphin Mini','Seagull','Yuan Plus','Song Plus'],
  'Peugeot':['208','301','2008','3008'],
  'Subaru':['Impreza','XV','Forester']
};
const COLORES = [['Blanco','#ffffff'],['Negro','#111111'],['Gris','#7d8088'],['Plata','#c7cad1'],['Rojo','#c62828'],['Vino','#6d1b2b'],
  ['Azul','#1e4fbf'],['Azul marino','#14213d'],['Celeste','#7cc4f0'],['Verde','#2e7d32'],['Beige','#d9c7a3'],['Café','#6b4423'],
  ['Dorado','#c8a24a'],['Naranja','#ef7d1a'],['Amarillo','#f2c230']];
const colorHex = n => { const c = COLORES.find(([k])=>k.toLowerCase()===String(n||'').trim().toLowerCase()); return c ? c[1] : null; };
const punto = n => { const h = colorHex(n); return h ? `<span class="punto" style="--c:${h}" aria-hidden="true"></span>` : ''; };
/* Si lo escrito coincide con un nombre conocido (sin importar mayúsculas), usa el nombre bien escrito */
function normalizar(texto, lista){
  const t = String(texto||'').trim(); if(!t) return t;
  const hit = lista.find(x=>x.toLowerCase()===t.toLowerCase());
  return hit || t.charAt(0).toUpperCase() + t.slice(1);
}
function marcaConocida(m){ return Object.keys(MODELOS).find(k=>k.toLowerCase()===String(m||'').trim().toLowerCase()); }
function actualizarModelos(){
  const m = marcaConocida(document.getElementById('f_marca').value);
  const lista = m ? MODELOS[m] : Object.values(MODELOS).flat();
  document.getElementById('dl_modelos').innerHTML = lista.map(x=>`<option value="${esc(x)}">`).join('');
}
function marcarColor(){
  const v = document.getElementById('f_color').value.trim().toLowerCase();
  document.querySelectorAll('#colores button').forEach(b=>b.classList.toggle('on', b.dataset.c.toLowerCase()===v));
}

/* ---------- cálculos ---------- */
function listaTarifas(v){
  const t = (Array.isArray(v.tarifas) && v.tarifas.length) ? v.tarifas.slice() : [{desde:v.fechaInicio, monto:+v.tarifa||0}];
  return t.sort((a,b)=>String(a.desde).localeCompare(String(b.desde)));
}
function tarifaEn(tarifas, d){
  const iso = isoF(d); let m = +tarifas[0].monto || 0;
  for(const t of tarifas) if(String(t.desde) <= iso) m = +t.monto || 0;
  return m;
}
/* Recorre día por día desde la entrega: cada día cobrable suma la tarifa.
   Los pagos se aplican en orden a los días más antiguos. */
function calc(v){
  const h = hoy(), ini = parseF(v.fechaInicio);
  const finalizado = v.estado === 'finalizado';
  const fin = finalizado && v.fechaFin ? parseF(v.fechaFin) : null;
  const limite = fin && fin < h ? fin : h;
  const tarifas = listaTarifas(v);
  const pagos = v.pagos || [];
  const pagado = pagos.reduce((s,p)=>s + (+p.monto||0), 0);
  const tope = addDays(h, 400);
  let cum = 0, devengado = 0, devAyer = 0, prox = null, proxFalta = 0, pagadoHasta = null, diasAtraso = 0, diasCobrados = 0;
  const dias = new Map(), diasDebe = [];
  for(let d = new Date(ini), guard = 0; guard < 6000; guard++, d = addDays(d,1)){
    const enPeriodo = d <= limite;
    if(!enPeriodo && (prox || fin || d > tope)) break;
    const cob = true;
    const m = tarifaEn(tarifas, d);
    const antes = cum; cum += m;
    if(enPeriodo){
      devengado += m; if(d < h) devAyer += m;
      if(cob) diasCobrados++;
      dias.set(isoF(d), {cob, m, antes, despues:cum});
    }
    if(cob && m > 0){
      if(cum <= pagado + 0.01) pagadoHasta = new Date(d);
      else {
        if(!prox){ prox = new Date(d); proxFalta = cum - Math.max(antes, pagado); }
        if(enPeriodo) diasDebe.push({f:new Date(d), falta: cum - Math.max(antes, pagado)});
        if(d < h) diasAtraso++;
      }
    }
  }
  const deuda = Math.max(0, devengado - pagado);
  const vencido = Math.max(0, devAyer - pagado);
  const aFavor = Math.max(0, pagado - devengado);
  let estado;
  if(finalizado) estado = deuda > 0.01 ? 'bad' : 'done';
  else if(vencido > 0.01) estado = 'bad';
  else if(deuda > 0.01) estado = 'warn';
  else estado = 'ok';
  // próximo pago: si debe algo, es hoy por todo lo que debe; si está al día, el siguiente día sin cubrir
  let proxFecha = null, proxMonto = 0;
  if(deuda > 0.01){ proxFecha = finalizado ? null : h; proxMonto = deuda; }
  else if(!finalizado && prox){ proxFecha = prox; proxMonto = proxFalta; }
  const ultimoPago = pagos.length ? pagos.map(p=>String(p.fecha)).sort().pop() : null;
  return {pagado, devengado, deuda, vencido, aFavor, estado, diasAtraso, diasCobrados, pagadoHasta, primerImpago: prox, diasDebe,
          proxFecha, proxMonto, tarifaHoy: tarifaEn(tarifas, h), tarifas, dias, ini, fin, ultimoPago, h};
}
function estadoDia(c, d){
  const iso = isoF(d);
  if(d < c.ini || (c.fin && d > c.fin)) return 'na';
  const x = c.dias.get(iso);
  if(!x) return 'na';
  const esHoy = +d === +c.h;
  if(x.despues <= c.pagado + 0.01) return esHoy ? 'hoy pag' : 'pag';
  if(x.antes < c.pagado - 0.01) return esHoy ? 'hoy parc' : 'parc';
  return esHoy ? 'hoy' : 'deb';
}
function tiraDias(c, n){
  const NOMBRES = {pag:'pagado', parc:'pago parcial', deb:'sin pagar', na:'sin alquiler', hoy:'hoy, pendiente', 'hoy pag':'hoy, pagado', 'hoy parc':'hoy, pago parcial'};
  let html = '';
  for(let i = n-1; i >= 0; i--){
    const d = addDays(c.h, -i), e = estadoDia(c, d);
    html += `<i class="${e}" title="${fmtCorta(d)}: ${NOMBRES[e]}"></i>`;
  }
  return `<div class="dias" aria-label="Últimos ${n} días">${html}</div>`;
}
const LEYENDA = `<div class="leyenda"><span style="--c:var(--day-pag)">Pagado</span><span style="--c:var(--day-parc)">Parcial</span><span style="--c:var(--day-deb)">Sin pagar</span></div>`;
function chip(c){
  if(c.estado==='done') return '<span class="chip done">Finalizado ✓</span>';
  const n = c.diasDebe.length;
  if(c.deuda > 0.01) return `<span class="chip ${c.estado==='bad'?'bad':'warn'}">${n===1 && c.estado!=='bad' ? 'Debe hoy' : 'Debe '+plural(n,'día')}</span>`;
  return '<span class="chip ok">Al día</span>';
}
const colorDeuda = c => c.deuda > 0.01 ? (c.estado==='bad' ? 'var(--danger)' : 'var(--warn)') : 'var(--ok)';

function leerForm(){
  const f = document.getElementById('vehForm'); const o = {};
  for(const k of CAMPOS) o[k] = String(f.elements[k].value).trim();
  o.tarifaDesde = f.elements.tarifaDesde.value;
  return o;
}
/* Arma la lista de tarifas: al editar, las anteriores a "desde" se conservan y desde esa fecha rige la nueva */
function construirTarifas(base, o){
  const tarifa = +o.tarifa;
  if(!base) return [{desde:o.fechaInicio, monto:tarifa}];
  const desde = o.tarifaDesde || isoF(hoy());
  let tarifas = listaTarifas(base);
  if(o.fechaInicio !== base.fechaInicio) tarifas[0] = {...tarifas[0], desde:o.fechaInicio};
  if(tarifa !== tarifaEn(tarifas, parseF(desde))){
    tarifas = tarifas.filter(t=>String(t.desde) < desde);
    tarifas.push({desde: tarifas.length ? desde : o.fechaInicio, monto:tarifa});
  }
  return tarifas;
}
/* "del 9 nov al 12 nov, 14 nov" — agrupa días seguidos */
function rangosDias(lista){
  const grupos = [];
  for(const x of lista){
    const g = grupos[grupos.length-1];
    if(g && difDias(x.f, g.hasta) === 1) g.hasta = x.f; else grupos.push({desde:x.f, hasta:x.f});
  }
  const corta = d => d.toLocaleDateString('es',{day:'numeric',month:'short'});
  return grupos.map(g => +g.desde === +g.hasta ? corta(g.desde) : `del ${corta(g.desde)} al ${corta(g.hasta)}`).join(', ');
}
function preview(){
  const f = document.getElementById('vehForm');
  const o = leerForm();
  const editando = !!o.id, cambio = editando && f.dataset.tarifaOriginal !== '' && +o.tarifa !== +f.dataset.tarifaOriginal;
  document.getElementById('wrapDesde').hidden = !cambio;
  const el = document.getElementById('preview');
  if(!(+o.tarifa>0) || !o.fechaInicio){ el.textContent='Escribe cuánto paga por día para ver el cálculo.'; return; }
  const base = editando ? data.find(x=>x.id===o.id) : null;
  const c = calc({...(base||{}), fechaInicio:o.fechaInicio, tarifas:construirTarifas(base, o), pagos: base ? base.pagos||[] : []});
  const nDeb = c.diasDebe.length;
  el.innerHTML = `Paga <b>${money(o.tarifa)}</b> por día · <b>${money(o.tarifa*7)}</b> por semana · <b>${money(o.tarifa*30)}</b> por 30 días.<br>
    ${c.ini > c.h ? `Empieza a cobrarse el <b>${fmtF(c.ini)}</b>.`
      : nDeb ? `Debe <b style="color:var(--danger)">${money(c.deuda)}</b> de ${plural(nDeb,'día')}: ${rangosDias(c.diasDebe)}.`
      : `<span style="color:var(--ok)">No debe nada${c.pagadoHasta?` · pagado hasta el ${fmtF(c.pagadoHasta)}`:''}.</span>`}
    ${cambio?'<br><span style="color:var(--warn)">El cambio de tarifa no afecta los días anteriores a la fecha que elijas.</span>':''}`;
}
async function guardarVehiculo(e){
  e.preventDefault();
  const o = leerForm();
  o.placa = o.placa.toUpperCase();
  o.telefono = formatoTel(o.telefono);
  o.marca = normalizar(o.marca, Object.keys(MODELOS));
  o.modelo = normalizar(o.modelo, MODELOS[marcaConocida(o.marca)] || Object.values(MODELOS).flat());
  o.color = normalizar(o.color, COLORES.map(c=>c[0]));
  o.tarifa = +o.tarifa;
  lsSet('vehiculos_tarifa', o.tarifa);
  const base = o.id ? data.find(x=>x.id===o.id) : null;
  const tarifas = construirTarifas(base, o); delete o.tarifaDesde;
  const v = base ? {...base, ...o, tarifas}
    : {...o, id: uid(), tarifas, pagos:[], estado:'activo', creado:new Date().toISOString()};
  const btn = document.getElementById('btnGuardar'); btn.disabled = true;
  try{
    await guardarDoc(v);
    cerrar('ovForm'); toast('Alquiler guardado');
    reemplazar(v); render(); verDetalle(v.id);
  }catch(err){ errorGuardar(err); }
  finally{ btn.disabled = false; }
}

async function registrarPago(id, monto, fecha, nota){
  const base = data.find(x=>x.id===id); if(!base) return false;
  const v = {...base, pagos:[...(base.pagos||[]), {id:uid(), monto, fecha, nota}]};
  try{
    await guardarDoc(v); reemplazar(v); render();
    if(document.getElementById('ovDetalle').classList.contains('open')) verDetalle(id);
    return true;
  }catch(err){ errorGuardar(err); return false; }
}

function abonar(id, todo){
  const v = data.find(x=>x.id===id); if(!v) return;
  const c = calc(v), debe = c.deuda > 0.01;
  const despues = m => calc({...v, pagos:[...(v.pagos||[]), {monto:m}]});
  const estadoTxt = c2 => c2.deuda > 0.01
    ? `Queda debiendo <b style="color:var(--danger)">${money(c2.deuda)}</b> de ${plural(c2.diasDebe.length,'día')}: ${rangosDias(c2.diasDebe)}.`
    : `<span style="color:var(--ok)">✓ Queda al día</span>${c2.pagadoHasta?`, pagado hasta el <b>${fmtF(c2.pagadoHasta)}</b>`:''}${c2.aFavor>0.01?` · saldo a favor <b>${money(c2.aFavor)}</b>`:''}.`;
  abrirAbono({
    titulo: debe ? 'Abonar a la deuda' : 'Adelantar pago',
    resumen: `<b>${esc(v.nombre)}</b> · ${esc(nombreAuto(v))} <span class="placa">${esc(v.placa)}</span><br>` +
      (debe ? `Debe <b style="color:var(--danger)">${money(c.deuda)}</b> de ${plural(c.diasDebe.length,'día')}: ${rangosDias(c.diasDebe)}.`
            : `<span style="color:var(--ok)">No debe nada</span>${c.pagadoHasta?` · pagado hasta el ${fmtF(c.pagadoHasta)}`:''}.`),
    rapidos: debe
      ? [[`Todo · ${money(c.deuda)}`, c.deuda], ...(c.deuda > c.tarifaHoy*2 ? [[`La mitad · ${money(c.deuda/2)}`, c.deuda/2]] : []), [`1 día · ${money(c.tarifaHoy)}`, c.tarifaHoy]]
      : [[`1 día · ${money(c.tarifaHoy)}`, c.tarifaHoy], [`1 semana · ${money(c.tarifaHoy*7)}`, c.tarifaHoy*7]],
    montoInicial: todo ? c.deuda : 0,
    previsualizar: m => 'Después del abono: ' + estadoTxt(despues(m)),
    guardar: (m, fecha, nota) => registrarPago(id, m, fecha, nota),
    recibo: (m, fecha) => {
      const c2 = calc(data.find(x=>x.id===id));
      return {
        tel: v.telefono,
        resumen: `Abono de <b>${money(m)}</b> de ${esc(v.nombre)}.<br>${estadoTxt(c2)}`,
        texto: `Hola ${v.nombre}, recibí tu pago de ${money(m)} el ${fmtF(fecha)} por el vehículo ${nombreAuto(v)} (placa ${v.placa}). ` +
          (c2.deuda > 0.01 ? `Saldo pendiente: ${money(c2.deuda)} (${rangosDias(c2.diasDebe)}).`
                           : `Quedas al día${c2.pagadoHasta?` hasta el ${fmtF(c2.pagadoHasta)}`:''}${c2.aFavor>0.01?`, con ${money(c2.aFavor)} a favor`:''}.`) +
          ' ¡Gracias!'
      };
    }
  });
}
async function borrarPago(pid){
  if(!await confirmar('Borrar pago','¿Seguro que quieres borrar este pago?','Borrar')) return;
  const base = data.find(x=>x.id===abiertoId); if(!base) return;
  const v = {...base, pagos:(base.pagos||[]).filter(p=>p.id!==pid)};
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(v.id); toast('Pago borrado'); }
  catch(err){ errorGuardar(err); }
}
async function finalizar(id){
  const base = data.find(x=>x.id===id); if(!base) return;
  if(!await confirmar('Finalizar alquiler', `¿El vehículo fue devuelto hoy (${fmtF(hoy())})? Desde mañana ya no se cobrará la tarifa a <b>${esc(base.nombre)}</b>.`, 'Finalizar')) return;
  const v = {...base, estado:'finalizado', fechaFin:isoF(hoy())};
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(id); toast('Alquiler finalizado'); }
  catch(err){ errorGuardar(err); }
}
async function reactivar(id){
  const base = data.find(x=>x.id===id); if(!base) return;
  if(!await confirmar('Reactivar alquiler', 'Se volverá a cobrar la tarifa diaria, incluidos los días desde que se finalizó. ¿Continuar?', 'Reactivar')) return;
  const v = {...base, estado:'activo'}; delete v.fechaFin;
  try{ await guardarDoc(v); reemplazar(v); render(); verDetalle(id); toast('Alquiler reactivado'); }
  catch(err){ errorGuardar(err); }
}
async function borrarVehiculo(id){
  const v = data.find(x=>x.id===id); if(!v) return;
  if(!await confirmar('Eliminar alquiler',`¿Eliminar el alquiler de <b>${esc(v.nombre)}</b> (${esc(v.placa)}) con todos sus pagos? Esta acción no se puede deshacer.`,'Eliminar')) return;
  try{
    await rpc('borrar_vehiculo', {p_clave:clave||'', p_id:id});
    data = data.filter(x=>x.id!==id);
    cerrar('ovDetalle'); render(); toast('Alquiler eliminado');
  }catch(err){ errorGuardar(err); }
}

/* ---------- respaldo ---------- */
function exportar(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo-vehiculos-' + isoF(hoy()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  marcarRespaldo('vehiculos');
  toast('Copia de seguridad descargada');
}
async function importar(e){
  const file = e.target.files[0]; e.target.value=''; if(!file) return;
  let d;
  try{ d = JSON.parse(await file.text()); if(!Array.isArray(d)) throw 0; }
  catch(err){ toast('El archivo no es un respaldo válido.'); return; }
  if(!await confirmar('Restaurar respaldo',`Se cargarán <b>${d.length}</b> alquileres y se reemplazarán los que hay ahora (${data.length}). ¿Continuar?`,'Restaurar')) return;
  toast('Cargando respaldo…');
  try{
    const nuevos = d.map(v=>({...v, id: (v.id && /^[A-Za-z0-9_\-]{1,64}$/.test(v.id)) ? v.id : uid(), pagos: v.pagos||[]}));
    await rpc('restaurar_vehiculos', {p_clave:clave||'', p_lista:nuevos});
    data = nuevos; render(); toast(`Respaldo restaurado: ${nuevos.length} alquileres`);
  }catch(err){ errorGuardar(err); }
}

/* ---------- modales ---------- */
function abrir(id){ document.getElementById(id).classList.add('open'); }
function cerrar(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('mousedown', e=>{ if(e.target===o && o.id!=='ovConfirm') o.classList.remove('open'); }));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay.open').forEach(o=>{ if(o.id==='ovConfirm') document.getElementById('cNo').click(); else o.classList.remove('open'); }); });
function confirmar(titulo, html, si){
  return new Promise(res=>{
    document.getElementById('cTitulo').textContent = titulo;
    document.getElementById('cTexto').innerHTML = html;
    const bSi = document.getElementById('cSi'), bNo = document.getElementById('cNo');
    bSi.textContent = si || 'Sí, continuar';
    const fin = v => { cerrar('ovConfirm'); bSi.onclick = bNo.onclick = null; res(v); };
    bSi.onclick = () => fin(true); bNo.onclick = () => fin(false);
    abrir('ovConfirm'); bNo.focus();
  });
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }
function aviso(t){ const el=document.getElementById('aviso'); el.hidden=!t; el.textContent=t||''; }
/* ---------- carga de datos (se actualiza sola cada 10 segundos) ---------- */
async function cargar(){
  try{
    const filas = await leerFilas('vehiculos');
    sinTabla = false;
    aviso('');
    const firma = filas.map(f=>f.id+'@'+f.actualizado).join('|');
    if(firma === versionDatos && cargado) return;
    versionDatos = firma; data = filas.map(f=>({...f.datos, id:f.id})); cargado = true;
    render();
    const ov = document.getElementById('ovDetalle');
    if(ov.classList.contains('open') && abiertoId) verDetalle(abiertoId);
  }catch(e){
    if(claveRechazada(e)) return;
    if(e && e.status===404){ sinTabla = true; cargado = true; aviso(''); render(); return; }
    aviso(cargado ? 'Sin conexión: los datos pueden no estar actualizados.' : 'No se pudo conectar con la base de datos. Revisa tu conexión a internet.');
  }
}
prepararCampoTel(document.getElementById('f_tel'));
montarMenu('menuMas', [
  ['⬇ Descargar copia de seguridad', exportar],
  ['⬆ Restaurar copia de seguridad', () => document.getElementById('fileImport').click()],
  ['🔓 Salir en este dispositivo', () => salir()]
]);
iniciarAcceso('Mis Vehículos', async () => {
  render();
  await cargar();
  setInterval(cargar, 10000);
  setInterval(render, 60*60*1000);
});
</script>
