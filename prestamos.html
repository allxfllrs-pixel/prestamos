<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mis Préstamos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1f6f5c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: banda verde de cabecera + resumen + tarjetas de clientes; detalle en modal */
:root{
  --bg:#f2f5f4; --card:#ffffff; --text:#1b2622; --muted:#64736d; --line:#dde5e2; --soft:#eaf0ee;
  --primary:#1f6f5c; --primary-2:#2a8f77; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.16);
  --danger:#c0392b; --warn:#b7700a; --ok:#1e8e4e;
  --chip-ok:#e3f5ea; --chip-warn:#fdf0dc; --chip-bad:#fbe5e2; --chip-done:#e6ecea;
  --shadow:0 1px 3px rgba(20,40,34,.08); --scrim:rgba(10,20,16,.5); --toast:#1b2622; --toast-text:#fff;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111715; --card:#19211e; --text:#e5ece9; --muted:#93a39c; --line:#2a3531; --soft:#212b27;
    --primary:#1b5c4c; --primary-2:#4cbf9f; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.12);
    --danger:#ef6b5b; --warn:#f0a93b; --ok:#4cc77f;
    --chip-ok:#1d3a2a; --chip-warn:#3d2f17; --chip-bad:#42201c; --chip-done:#26302c;
    --shadow:none; --scrim:rgba(0,0,0,.6); --toast:#e5ece9; --toast-text:#111715;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715; --card:#19211e; --text:#e5ece9; --muted:#93a39c; --line:#2a3531; --soft:#212b27;
  --primary:#1b5c4c; --primary-2:#4cbf9f; --on-primary:#ffffff; --head-btn:rgba(255,255,255,.12);
  --danger:#ef6b5b; --warn:#f0a93b; --ok:#4cc77f;
  --chip-ok:#1d3a2a; --chip-warn:#3d2f17; --chip-bad:#42201c; --chip-done:#26302c;
  --shadow:none; --scrim:rgba(0,0,0,.6); --toast:#e5ece9; --toast-text:#111715;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1100px;margin:0 auto}
header{background:var(--primary);color:var(--on-primary);padding-block:14px}
header .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:21px;flex:1;min-width:150px}
main{padding-block:16px 40px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px}
button:hover{filter:brightness(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
header button{background:var(--head-btn);border-color:rgba(255,255,255,.3);color:var(--on-primary)}
header button.primary{background:var(--on-primary);color:var(--primary);border-color:var(--on-primary);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.small{padding:4px 10px;font-size:13px}
a.btn{display:inline-block;text-decoration:none;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px}
a.inicio{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--head-btn);border:1px solid rgba(255,255,255,.3);color:var(--on-primary);text-decoration:none;font-size:18px;font-weight:700}
.aviso{background:var(--chip-warn);color:var(--text);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:100%}
textarea{resize:vertical;min-height:60px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.loan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.loan:hover{border-color:var(--primary-2)}
.loan .pie{display:flex;justify-content:flex-end;margin-top:10px}
.loan .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.loan h3{margin:0;font-size:17px}
.phone{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.grid2 span{color:var(--muted)}
.grid2 b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary-2)}
.chip{font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.chip.ok{background:var(--chip-ok);color:var(--ok)}
.chip.warn{background:var(--chip-warn);color:var(--warn)}
.chip.bad{background:var(--chip-bad);color:var(--danger)}
.chip.done{background:var(--chip-done);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;
  padding:max(20px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 20px max(12px, env(safe-area-inset-left, 0px));overflow:auto;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:720px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);min-width:0}
.modal.chico{max-width:420px}
.modal h2{margin:0 0 12px;font-size:19px}
.modal .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.check{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;cursor:pointer;margin:0}
.check input{width:auto;margin:0}
.fechas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:10px}
.fechas label{margin-bottom:2px}
.preview{grid-column:1/-1;background:var(--soft);border-radius:8px;padding:10px;font-size:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.section{margin-top:18px}
.section h4{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.info div{background:var(--soft);border-radius:8px;padding:8px 10px}
.info span{display:block;font-size:12px;color:var(--muted)}
.info b{font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:var(--toast);color:var(--toast-text);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* Prestadores (personas a las que les doy dinero para que lo presten) */
.carteras{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.carteras button{white-space:nowrap;flex:none}
.carteras button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.carteras .nuevo{border-style:dashed;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.panel h2{margin:0;font-size:20px}
.panel .stats{margin:12px 0 0}
.panel .stat{box-shadow:none;background:var(--soft);border-color:transparent}
.panel .stat .v{font-size:17px;white-space:nowrap}
.panel .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
tr.clic{cursor:pointer}
tr.clic:hover td{background:var(--soft)}
.de{font-size:12px;color:var(--muted);margin-top:4px}
@media (max-width:600px){
  .form{grid-template-columns:1fr}
  .list{grid-template-columns:1fr}
}
</style>

<header>
  <div class="wrap gut">
    <a class="inicio" href="./" title="Volver al inicio" aria-label="Volver al inicio">←</a>
    <h1>Mis Préstamos</h1>
    <div id="menuMas"></div>
    <input type="file" id="fileImport" accept=".json,application/json" hidden onchange="importar(event)">
    <button class="primary" id="btnNuevo" onclick="abrirForm()">+ Nuevo préstamo</button>
  </div>
</header>

<main class="wrap gut">
  <div class="aviso" id="aviso" hidden></div>
  <div id="respaldoAviso" hidden></div>
  <div class="carteras" id="carteras" role="tablist" aria-label="Cartera"></div>
  <div id="panelPrestador" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input id="buscar" placeholder="Buscar por nombre o teléfono..." oninput="render()">
    <div class="filters" id="filters">
      <button data-f="activos" class="on">Activos</button>
      <button data-f="atrasados">Atrasados</button>
      <button data-f="pagados">Pagados</button>
    </div>
  </div>
  <div class="list" id="list"><div class="empty">Cargando préstamos…</div></div>
</main>

<!-- Formulario préstamo -->
<div class="overlay" id="ovForm">
  <div class="modal">
    <div class="head"><h2 id="formTitle">Nuevo préstamo</h2><button class="small" onclick="cerrar('ovForm')">✕</button></div>
    <form class="form" id="loanForm" onsubmit="guardarPrestamo(event)">
      <input type="hidden" name="id" id="f_id">
      <div class="full" id="bloquePrest" hidden><label for="f_prest">¿Quién presta este dinero?</label>
        <select name="prestadorId" id="f_prest"></select></div>
      <div class="full"><label for="f_nombre">Nombre completo *</label><input name="nombre" id="f_nombre" required></div>
      <div><label for="f_tel">Teléfono *</label><input name="telefono" id="f_tel" type="tel" required></div>
      <div><label for="f_doc">Cédula / Documento</label><input name="documento" id="f_doc"></div>
      <div class="full"><label for="f_dir">Dirección</label><input name="direccion" id="f_dir"></div>
      <div><label for="f_cap">Monto prestado (capital) *</label><input name="capital" id="f_cap" type="number" min="1" step="any" required oninput="preview()"></div>
      <div><label for="f_ini">Fecha de inicio *</label><input name="fechaInicio" id="f_ini" type="date" required oninput="preview()"></div>
      <div><label for="f_tasa">Tasa de interés (%) *</label><input name="tasa" id="f_tasa" type="number" min="0" step="any" required oninput="preview()"></div>
      <div><label for="f_tipo">Tipo de interés</label>
        <select name="tipoInteres" id="f_tipo" onchange="preview()">
          <option value="mensual">% mensual (se cobra por cada mes)</option>
          <option value="total">% único sobre el total</option>
        </select>
      </div>
      <div><label for="f_freq">Frecuencia de pago</label>
        <select name="frecuencia" id="f_freq" onchange="preview()">
          <option value="diario">Diario</option>
          <option value="semanal">Semanal</option>
          <option value="quincenal">Quincenal</option>
          <option value="mensual" selected>Mensual</option>
        </select>
      </div>
      <div><label for="f_cuotas">Número de cuotas *</label><input name="cuotas" id="f_cuotas" type="number" min="1" step="1" required oninput="armarFechas();preview()"></div>
      <div class="full" id="bloqueFechas">
        <label class="check"><input type="checkbox" id="f_manual" onchange="armarFechas();preview()"> 📅 Poner a mano la fecha de cada pago</label>
        <div class="fechas" id="fechasManual" hidden></div>
      </div>
      <div class="full"><label for="f_notas">Notas</label><textarea name="notas" id="f_notas" placeholder="Garantía, referencias, acuerdos..."></textarea></div>
      <div class="preview" id="preview">Completa los datos para ver el cálculo.</div>
      <div class="full actions">
        <button type="button" onclick="cerrar('ovForm')">Cancelar</button>
        <button type="submit" class="primary" id="btnGuardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Detalle -->
<div class="overlay" id="ovDetalle"><div class="modal" id="detalle"></div></div>

<!-- Confirmación -->
<div class="overlay" id="ovConfirm">
  <div class="modal chico">
    <h2 id="cTitulo">¿Confirmar?</h2>
    <div id="cTexto"></div>
    <div class="actions">
      <button id="cNo">Cancelar</button>
      <button id="cSi" class="primary">Sí, continuar</button>
    </div>
  </div>
</div>

<!-- Cambiar clave -->
<div class="overlay" id="ovClave">
  <div class="modal chico">
    <h2>Cambiar clave de administrador</h2>
    <form id="claveForm" onsubmit="cambiarClave(event)" style="display:grid;gap:10px">
      <div><label for="k_actual">Clave actual</label><input id="k_actual" type="password" autocomplete="current-password" required></div>
      <div><label for="k_nueva">Clave nueva (mínimo 6 caracteres)</label><input id="k_nueva" type="password" autocomplete="new-password" minlength="6" required></div>
      <div><label for="k_repite">Repite la clave nueva</label><input id="k_repite" type="password" autocomplete="new-password" minlength="6" required></div>
      <div id="k_error" style="color:var(--danger);font-size:13px" hidden></div>
      <div class="actions" style="margin-top:4px">
        <button type="button" onclick="cerrar('ovClave')">Cancelar</button>
        <button type="submit" class="primary" id="k_btn">Cambiar clave</button>
      </div>
    </form>
  </div>
</div>

<!-- Prestador (crear / editar) -->
<div class="overlay" id="ovPrestador">
  <div class="modal chico">
    <div class="head"><h2 id="prTitulo">Nuevo prestador</h2><button class="small" type="button" onclick="cerrar('ovPrestador')" aria-label="Cerrar">✕</button></div>
    <form id="prForm" onsubmit="guardarPrestador(event)" style="display:grid;gap:10px">
      <input type="hidden" id="pr_id">
      <div><label for="pr_nombre">Nombre *</label><input id="pr_nombre" required autocomplete="off"></div>
      <div><label for="pr_tel">Teléfono</label><input id="pr_tel" type="tel"></div>
      <div><label for="pr_notas">Notas</label><textarea id="pr_notas" placeholder="Cómo se reparten la ganancia, acuerdos..."></textarea></div>
      <div class="actions" style="margin-top:4px">
        <button type="button" class="danger" id="prBorrar" onclick="borrarPrestador()" hidden>Eliminar</button>
        <button type="button" onclick="cerrar('ovPrestador')">Cancelar</button>
        <button type="submit" class="primary" id="prBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Dinero entregado a un prestador (o que me devolvió) -->
<div class="overlay" id="ovEntrega">
  <div class="modal chico">
    <div class="head"><h2 id="enTitulo">Entregar dinero</h2><button class="small" type="button" onclick="cerrar('ovEntrega')" aria-label="Cerrar">✕</button></div>
    <form id="enForm" onsubmit="guardarEntrega(event)" style="display:grid;gap:10px">
      <input type="hidden" id="en_tipo">
      <div class="preview" id="en_info"></div>
      <div><label for="en_monto">Monto *</label><input id="en_monto" type="number" min="0.01" step="any" required style="font-size:20px;font-weight:700"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label for="en_fecha">Fecha</label><input id="en_fecha" type="date" required></div>
        <div><label for="en_nota">Nota (opcional)</label><input id="en_nota" placeholder="Efectivo..."></div>
      </div>
      <div class="actions" style="margin-top:4px">
        <button type="button" onclick="cerrar('ovEntrega')">Cancelar</button>
        <button type="submit" class="primary" id="enBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="comun.js"></script>
<script>
const COL = 'prestamos';
let data = [];
/* Prestadores: se guardan en la misma tabla que los préstamos, con datos.tipo = 'prestador'.
   Cada préstamo puede llevar prestadorId (si no lo tiene, es mío). */
let prestadores = [];
let cartera = lsGet('prestamos_cartera') || 'todos';   // 'todos' | 'yo' | id de un prestador
let filtro = 'activos';
let abiertoId = null;
const puedeEditar = true;   // solo se entra con la clave
let cargado = false, versionDatos = -1;

/* ---------- utilidades ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => 'Lps ' + (Math.round((n||0)*100)/100).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseF(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); }
function isoF(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtF(d){ if(typeof d==='string') d=parseF(d); return d.toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'}); }
function hoy(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addMonths(d,n){
  const r = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(r.getFullYear(), r.getMonth()+1, 0).getDate();
  r.setDate(Math.min(d.getDate(), last)); return r;
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
const DIAS = {diario:1, semanal:7, quincenal:15, mensual:30};
const NOMBRE_FREQ = {diario:'Diario', semanal:'Semanal', quincenal:'Quincenal', mensual:'Mensual'};
function fechaCuota(p, i){
  if(Array.isArray(p.fechasManual) && p.fechasManual[i-1]) return parseF(p.fechasManual[i-1]);
  const ini = parseF(p.fechaInicio);
  if(p.frecuencia==='mensual') return addMonths(ini, i);
  return addDays(ini, (DIAS[p.frecuencia]||30)*i);
}

/* ---------- cálculos ---------- */
function diasAviso(){ const v = parseInt(lsGet('prestamos_aviso'),10); return isNaN(v) ? 3 : v; }

function calc(p){
  const capital = +p.capital, tasa = +p.tasa, cuotas = Math.max(1, +p.cuotas|0);
  const meses = p.frecuencia==='mensual' ? cuotas : cuotas*(DIAS[p.frecuencia]||30)/30;
  const interes = p.tipoInteres==='total' ? capital*tasa/100 : capital*tasa/100*meses;
  const total = capital + interes;
  const valorCuota = total / cuotas;
  const pagado = (p.abonos||[]).reduce((s,a)=>s + +a.monto, 0);
  const saldo = Math.max(0, total - pagado);
  const cuotasPagadas = Math.min(cuotas, Math.floor((pagado + 0.01) / valorCuota));
  const h = hoy();
  let vencidas = 0;
  for(let i=1;i<=cuotas;i++){ if(fechaCuota(p,i) < h) vencidas = i; else break; }
  const montoVencido = Math.max(0, Math.min(saldo, vencidas*valorCuota - pagado));
  const pagadoTotal = saldo <= 0.01;
  const proxima = pagadoTotal ? null : fechaCuota(p, Math.min(cuotas, cuotasPagadas+1));
  const diasAtraso = (montoVencido>0.01 && proxima) ? Math.round((h - proxima)/86400000) : 0;
  const diasParaVencer = proxima ? Math.round((proxima - h)/86400000) : null;
  let estado = 'ok';
  if(pagadoTotal) estado='done';
  else if(montoVencido>0.01) estado='bad';
  else if(diasParaVencer!==null && diasParaVencer <= diasAviso()) estado='warn';
  return {capital,tasa,cuotas,meses,interes,total,valorCuota,pagado,saldo,cuotasPagadas,
          cuotasPendientes:cuotas-cuotasPagadas,montoVencido,proxima,diasAtraso,diasParaVencer,estado,
          fechaFin:fechaCuota(p,cuotas)};
}
function chip(c){
  if(c.estado==='done') return '<span class="chip done">Pagado ✓</span>';
  if(c.estado==='bad') return `<span class="chip bad">Atrasado · ${money(c.montoVencido)}</span>`;
  if(c.estado==='warn') return '<span class="chip warn">Pago próximo</span>';
  return '<span class="chip ok">Al día</span>';
}

function calcPrestador(pr){
  const lista = data.filter(p=>p.prestadorId===pr.id).map(p=>({p,c:calc(p)}));
  const entregas = pr.entregas || [];
  const entregado = entregas.filter(e=>e.tipo!=='devolucion').reduce((s,e)=>s + +e.monto, 0);
  const devuelto = entregas.filter(e=>e.tipo==='devolucion').reduce((s,e)=>s + +e.monto, 0);
  const activos = lista.filter(x=>x.c.estado!=='done');
  const prestadoTotal = lista.reduce((s,x)=>s+x.c.capital, 0);
  const cobrado = lista.reduce((s,x)=>s+x.c.pagado, 0);
  return {
    lista, activos, entregado, devuelto, neto: entregado - devuelto,
    prestadoActivo: activos.reduce((s,x)=>s+x.c.capital, 0),
    porCobrar: activos.reduce((s,x)=>s+x.c.saldo, 0),
    vencido: activos.reduce((s,x)=>s+x.c.montoVencido, 0),
    atrasados: activos.filter(x=>x.c.estado==='bad').length,
    interes: lista.reduce((s,x)=>s+x.c.interes, 0),
    cobrado,
    // dinero que debería tener en la mano: lo que le di − lo que me devolvió − lo que prestó + lo que ya le pagaron
    enMano: entregado - devuelto - prestadoTotal + cobrado
  };
}

async function guardarPrestador(e){
  e.preventDefault();

  const telefono = document.getElementById('pr_tel').value.trim();
  const base = id ? prestadores.find(x=>x.id===id) : {id:'pr_'+uid(), tipo:'prestador', entregas:[], creado:new Date().toISOString()};

async function borrarPrestador(){
  const pr = prestadores.find(x=>x.id===document.getElementById('pr_id').value); if(!pr) return;
  const n = data.filter(p=>p.prestadorId===pr.id).length;
  if(n){ toast(`${pr.nombre} tiene ${n} préstamo${n===1?'':'s'}. Cámbialos a otro prestador (✏ Editar préstamo) antes de eliminarlo.`); return; }
  cerrar('ovPrestador');
  if(!await confirmar('Eliminar prestador', `¿Eliminar a <b>${esc(pr.nombre)}</b> y su historial de dinero entregado?`, 'Eliminar')) return;
  try{
    await rpc('borrar_prestamo', {p_clave:clave||'', p_id:pr.id});
    prestadores = prestadores.filter(x=>x.id!==pr.id);
    cartera = 'todos'; lsSet('prestamos_cartera', cartera);
    render(); toast('Prestador eliminado');

}

async function cambiarClave(e){
  e.preventDefault();
  const actual = document.getElementById('k_actual').value;
  const nueva = document.getElementById('k_nueva').value;
  const repite = document.getElementById('k_repite').value;
  const errEl = document.getElementById('k_error');
  const mostrar = t => { errEl.textContent = t; errEl.hidden = false; };
  if(nueva.length < 6) return mostrar('La clave nueva debe tener al menos 6 caracteres.');
  if(nueva !== repite) return mostrar('Las dos claves nuevas no coinciden.');
  if(nueva === actual) return mostrar('La clave nueva es igual a la actual.');
  const btn = document.getElementById('k_btn'); btn.disabled = true;
  try{
    await rpc('cambiar_clave', {p_clave:actual, p_nueva:nueva});
    clave = nueva; lsSet('prestamos_clave', nueva);
    cerrar('ovClave'); toast('Clave cambiada. Usa la nueva clave desde ahora.');
  }catch(err){ mostrar(err && err.message ? err.message : 'No se pudo cambiar la clave. Revisa tu conexión.'); }

/* Arma una casilla de fecha por cuota. Conserva lo ya escrito; las nuevas se llenan con la fecha automática. */
function armarFechas(guardadas){
  const f = document.getElementById('loanForm');
  const manual = document.getElementById('f_manual').checked;
  const cont = document.getElementById('fechasManual');
  cont.hidden = !manual;
  if(!manual) return;
  const n = Math.min(120, Math.max(1, parseInt(f.elements.cuotas.value,10) || 1));
  const previas = guardadas || [...cont.querySelectorAll('input')].map(x=>x.value);
  const base = {fechaInicio: f.elements.fechaInicio.value || isoF(hoy()), frecuencia: f.elements.frecuencia.value};
  let html = '';
  for(let i=1;i<=n;i++){
    const val = previas[i-1] || isoF(fechaCuota(base, i));
    html += `<div><label for="fm_${i}">Pago ${i}</label><input type="date" id="fm_${i}" class="fm" value="${val}" required oninput="preview()"></div>`;
  }
  cont.innerHTML = html;
}

  document.getElementById('bloquePrest').hidden = !prestadores.length;
  f.reset();
  document.getElementById('formTitle').textContent = p ? 'Editar préstamo' : 'Nuevo préstamo';
  sel.value = p ? (p.prestadorId || '') : (prestadores.some(x=>x.id===cartera) ? cartera : '');
  if(p){
    for(const k of ['id','nombre','telefono','documento','direccion','capital','fechaInicio','tasa','tipoInteres','frecuencia','cuotas','notas'])
      if(f.elements[k]) f.elements[k].value = k==='telefono' ? telParaForm(p[k]) : (p[k] ?? '');
  } else {
    f.elements.id.value = '';
    f.elements.fechaInicio.value = isoF(hoy());
    f.elements.tasa.value = lsGet('prestamos_tasa') || 10;
    f.elements.cuotas.value = 1;
  }
  const tieneManual = !!(p && Array.isArray(p.fechasManual));
  document.getElementById('f_manual').checked = tieneManual || !!irAFechas;
  document.getElementById('fechasManual').innerHTML = '';
  armarFechas(tieneManual ? p.fechasManual : null);
  preview();
  cerrar('ovDetalle');
  abrir('ovForm');
  if(irAFechas){ const b = document.getElementById('bloqueFechas'); b.scrollIntoView({block:'center'}); const x = b.querySelector('input.fm'); if(x) x.focus(); }
  else f.elements.nombre.focus();
}
function leerForm(){
  const f = document.getElementById('loanForm'); const o = {};
  for(const el of f.elements) if(el.name) o[el.name] = el.value.trim();
  o.fechasManual = leerFechasManual();
  return o;
}
function preview(){
  const o = leerForm();
  const el = document.getElementById('preview');
  if(!(+o.capital>0) || o.tasa==='' || !(+o.cuotas>0) || !o.fechaInicio){ el.textContent='Completa los datos para ver el cálculo.'; return; }
  const c = calc({...o, abonos:[]});
  const fm = o.fechasManual;
  const faltan = fm && fm.some(x=>!x);
  const desorden = fm && !faltan && fm.some((x,i)=>i>0 && x < fm[i-1]);
  if(desorden) o.fechasManual = [...fm].sort();   // el resumen muestra el orden en que quedarán
  el.innerHTML = `Interés: <b>${money(c.interes)}</b> · Total a pagar: <b>${money(c.total)}</b><br>
    ${c.cuotas} cuota${c.cuotas>1?'s':''} ${fm?'con fechas puestas a mano':`(${NOMBRE_FREQ[o.frecuencia].toLowerCase()})`} de <b>${money(c.valorCuota)}</b>
    ${faltan ? '<br><span style="color:var(--danger)">Falta poner la fecha de algún pago.</span>'
      : `· Primer pago: <b>${fmtF(fechaCuota(o,1))}</b> · Último: <b>${fmtF(fechaCuota(o,c.cuotas))}</b>`}
    ${desorden ? '<br><span style="color:var(--warn)">Las fechas no están en orden; al guardar se ordenan de la más próxima a la más lejana.</span>' : ''}`;
}
async function guardarPrestamo(e){
  e.preventDefault();
  const o = leerForm();
  o.telefono = formatoTel(o.telefono);
  o.capital = +o.capital; o.tasa = +o.tasa; o.cuotas = parseInt(o.cuotas,10);
  if(o.fechasManual){
    if(o.fechasManual.some(x=>!x)){ toast('Falta poner la fecha de algún pago.'); return; }
    o.fechasManual = o.fechasManual.slice(0, o.cuotas).sort();
  }
  lsSet('prestamos_tasa', o.tasa);
  let p;
  if(o.id){ p = {...data.find(x=>x.id===o.id), ...o}; }
  else { p = {...o, id: uid(), abonos: [], creado: new Date().toISOString()}; }
  if(!p.fechasManual) delete p.fechasManual;   // fechas automáticas según la frecuencia
  if(!p.prestadorId) delete p.prestadorId;     // sin prestador = préstamo mío
  const btn = document.getElementById('btnGuardar'); btn.disabled = true;
  try{
    await guardarDoc(p);
    cerrar('ovForm'); toast('Préstamo guardado');
    const i = data.findIndex(x=>x.id===p.id); if(i>=0) data[i]=p; else data.push(p);
    render(); verDetalle(p.id);
  }catch(err){ errorGuardar(err); }
  finally{ btn.disabled = false; }
}

/* Para los recibos: si está atrasado dice cuánto tiene vencido; si no, cuándo es la próxima cuota */
function siguientePaso(c){
  if(c.montoVencido > 0.01) return ` Tienes ${money(c.montoVencido)} vencido.`;
  return c.proxima ? ` Próxima cuota: ${fmtF(c.proxima)}.` : '';
}
/* Botón 💬 para mandar otra vez el recibo de un abono anterior (con el saldo de hoy) */
/* ---------- recibo / estado de cuenta en imagen ---------- */
function facturaPrestamo(p, abono){
  const c = calc(p);
  const filas = [];
  if(abono) filas.push({t:'Abono recibido', nota:'Fecha del abono: ' + fmtF(abono.fecha) + (abono.nota ? ' · ' + abono.nota : ''), v:money(+abono.monto), fuerte:true, color:'ok'});
  filas.push({seccion:'Préstamo'});
  filas.push({t:'Monto prestado', nota:'Desde el ' + fmtF(p.fechaInicio), v:money(c.capital)});
  filas.push({t:'Interés', nota:`${c.tasa}% ${p.tipoInteres==='mensual'?'mensual':'único'}`, v:money(c.interes)});
  filas.push({t:'Total a pagar', v:money(c.total)});
  filas.push({t:'Total abonado', v:money(c.pagado), color:'ok'});
  filas.push({t:'Cuotas pagadas', nota:`Cuota de ${money(c.valorCuota)}`, v:`${c.cuotasPagadas} de ${c.cuotas}`});
  if(c.montoVencido > 0.01) filas.push({t:'Vencido sin pagar', nota: c.proxima ? 'Desde el ' + fmtF(c.proxima) : '', v:money(c.montoVencido), color:'bad'});
  else if(c.proxima) filas.push({t:'Próxima cuota', v:fmtF(c.proxima)});
  const pagado = c.saldo <= 0.01;
  return {
    seccion:'Préstamos', color:'#127a6c',
    titulo: abono ? 'RECIBO DE ABONO' : 'ESTADO DE CUENTA',
    numero: abono ? 'A-' + String(abono.id).slice(-6).toUpperCase() : 'EC-' + isoF(hoy()).replace(/-/g,''),
    fecha: abono ? parseF(abono.fecha) : hoy(),
    cliente: [['Cliente', p.nombre], ['Teléfono', formatoTel(p.telefono)], ...(p.documento ? [['DNI', p.documento]] : [])],
    filas, totalLabel:'Saldo pendiente', total:money(c.saldo),
    estado: pagado ? {texto:'PAGADO  ✓', ok:true} : c.montoVencido > 0.01 ? {texto:'ATRASADO', ok:false} : {texto:'AL DÍA', ok:true},
    pie: abono ? '¡Gracias por su abono!' : 'Gracias por su puntualidad.',
    tel: p.telefono,
    archivo: (abono ? 'recibo-' : 'estado-cuenta-') + String(p.nombre||'cliente').replace(/\W+/g,'-') + '-' + (abono ? abono.fecha : isoF(hoy()))
  };
}
function facturaAbono(pid, aid){
  const p = data.find(x=>x.id===pid); if(!p) return;
  const a = (p.abonos||[]).find(x=>x.id===aid); if(!a) return;
  enviarFactura(facturaPrestamo(p, a));
}
function reciboViejo(p, c, a){
  const url = linkWhatsApp(p.telefono, `Hola ${p.nombre}, este es el recibo de tu abono de ${money(+a.monto)} del ${fmtF(a.fecha)}. ` +
    (c.saldo <= 0.01 ? 'Tu préstamo está pagado por completo.' : `Saldo pendiente hoy: ${money(c.saldo)}.` + siguientePaso(c)) + ' ¡Gracias!');
  return `<button class="small" style="margin-right:6px" onclick="facturaAbono('${p.id}','${a.id}')" title="Recibo en imagen">🧾</button>` +
    (url ? `<a class="btn small" style="padding:4px 10px;font-size:13px;margin-right:6px" href="${url}" target="_blank" rel="noopener" title="Enviar recibo como texto">💬</a>` : '');
}
async function registrarAbono(id, monto, fecha, nota){
  const base = data.find(x=>x.id===id); if(!base) return false;
  const p = {...base, abonos:[...(base.abonos||[]), {id:uid(), monto, fecha, nota}]};
  try{
    await guardarDoc(p);
    data[data.findIndex(x=>x.id===p.id)] = p;
    render();
    if(document.getElementById('ovDetalle').classList.contains('open')) verDetalle(p.id);
    return true;
  }catch(err){ errorGuardar(err); return false; }
}
/* Ventana de abono (la misma que en Vehículos), con recibo por WhatsApp al final */
function abonarPrestamo(id, montoInicial){
  const p = data.find(x=>x.id===id); if(!p) return;
  const c = calc(p);
  const faltaCuota = Math.min(c.saldo, (c.cuotasPagadas+1)*c.valorCuota - c.pagado);
  const estadoTxt = c2 => c2.saldo <= 0.01
    ? '<span style="color:var(--ok)">✓ El préstamo queda pagado por completo.</span>'
    : `Queda debiendo <b>${money(c2.saldo)}</b> · cuotas pagadas ${c2.cuotasPagadas} de ${c2.cuotas}.` +
      (c2.montoVencido>0.01 ? ` <span style="color:var(--danger)">Sigue con ${money(c2.montoVencido)} vencido.</span>`
                            : c2.proxima ? ` Próxima cuota: ${fmtF(c2.proxima)}.` : '');
  const rapidos = [];
  if(c.montoVencido>0.01) rapidos.push([`Lo vencido · ${money(c.montoVencido)}`, c.montoVencido]);
  if(faltaCuota>0.01 && Math.abs(faltaCuota-c.montoVencido)>0.01) rapidos.push([`Completar cuota · ${money(faltaCuota)}`, faltaCuota]);
  rapidos.push([`Todo · ${money(c.saldo)}`, c.saldo]);
  abrirAbono({
    titulo: 'Abonar al préstamo',
    resumen: `<b>${esc(p.nombre)}</b><br>Saldo pendiente <b>${money(c.saldo)}</b>` +
      (c.montoVencido>0.01 ? ` · <span style="color:var(--danger)">vencido ${money(c.montoVencido)}</span>` : '') +
      `<br>Cuota: ${money(c.valorCuota)} · pagadas ${c.cuotasPagadas} de ${c.cuotas}`,
    rapidos,
    montoInicial: montoInicial || 0,
    previsualizar: m => 'Después del abono: ' + estadoTxt(calc({...p, abonos:[...(p.abonos||[]), {monto:m}]})),
    guardar: (m, fecha, nota) => registrarAbono(id, m, fecha, nota),
    recibo: (m, fecha) => {
      const c2 = calc(data.find(x=>x.id===id));
      return {
        tel: p.telefono,
        factura: (()=>{ const pp = data.find(x=>x.id===id); return facturaPrestamo(pp, (pp.abonos||[]).at(-1)); })(),
        resumen: `Abono de <b>${money(m)}</b> de ${esc(p.nombre)}.<br>${estadoTxt(c2)}`,
        texto: `Hola ${p.nombre}, recibí tu abono de ${money(m)} el ${fmtF(fecha)}. ` +
          (c2.saldo <= 0.01 ? 'Tu préstamo quedó pagado por completo.'
            : `Saldo pendiente: ${money(c2.saldo)}.` + siguientePaso(c2)) +
          ' ¡Gracias!'
      };
    }
  });
}
async function borrarAbono(aid){
  if(!await confirmar('Borrar abono','¿Seguro que quieres borrar este abono?','Borrar')) return;
  const base = data.find(x=>x.id===abiertoId); if(!base) return;
  const p = {...base, abonos:(base.abonos||[]).filter(a=>a.id!==aid)};
  try{
    await guardarDoc(p);
    data[data.findIndex(x=>x.id===p.id)] = p;
    render(); verDetalle(p.id); toast('Abono borrado');
  }catch(err){ errorGuardar(err); }
}
async function borrarPrestamo(id){
  const p = data.find(x=>x.id===id); if(!p) return;
  if(!await confirmar('Eliminar préstamo',`¿Eliminar el préstamo de <b>${esc(p.nombre)}</b>? Esta acción no se puede deshacer.`,'Eliminar')) return;
  try{
    await rpc('borrar_prestamo', {p_clave:clave||'', p_id:id});
    data = data.filter(x=>x.id!==id);
    cerrar('ovDetalle'); render(); toast('Préstamo eliminado');
  }catch(err){ errorGuardar(err); }
}

/* ---------- respaldo ---------- */
function exportar(){
  const blob = new Blob([JSON.stringify([...prestadores, ...data],null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo-prestamos-' + isoF(hoy()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  marcarRespaldo('prestamos');
  toast('Copia de seguridad descargada');
}
async function importar(e){
  const file = e.target.files[0]; e.target.value=''; if(!file) return;
  let d;
  try{ d = JSON.parse(await file.text()); if(!Array.isArray(d)) throw 0; }
  catch(err){ toast('El archivo no es un respaldo válido.'); return; }
  const esPr = x => x && x.tipo === 'prestador';
  const nPr = d.filter(esPr).length;
  if(!await confirmar('Restaurar respaldo',`Se cargarán <b>${d.length - nPr}</b> préstamos${nPr ? ` y <b>${nPr}</b> prestador${nPr===1?'':'es'}` : ''} y se reemplazará todo lo que hay ahora (${data.length} préstamos). ¿Continuar?`,'Restaurar')) return;
  toast('Cargando respaldo…');
  try{
    const nuevos = d.map(p=>({...p, id: (p.id && /^[A-Za-z0-9_\-]{1,64}$/.test(p.id)) ? p.id : uid(), ...(esPr(p) ? {entregas: p.entregas||[]} : {abonos: p.abonos||[]})}));
    await rpc('restaurar_prestamos', {p_clave:clave||'', p_lista:nuevos});
    prestadores = nuevos.filter(esPr); data = nuevos.filter(x=>!esPr(x));
    render(); toast(`Respaldo restaurado: ${data.length} préstamos`);
  }catch(err){ errorGuardar(err); }
}

/* ---------- modales ---------- */
function abrir(id){ document.getElementById(id).classList.add('open'); }
function cerrar(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('mousedown', e=>{ if(e.target===o && o.id!=='ovConfirm') o.classList.remove('open'); }));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay.open').forEach(o=>{ if(o.id==='ovConfirm') document.getElementById('cNo').click(); else o.classList.remove('open'); }); });
function confirmar(titulo, html, si){
  return new Promise(res=>{
    document.getElementById('cTitulo').textContent = titulo;
    document.getElementById('cTexto').innerHTML = html;
    const bSi = document.getElementById('cSi'), bNo = document.getElementById('cNo');
    bSi.textContent = si || 'Sí, continuar';
    const fin = v => { cerrar('ovConfirm'); bSi.onclick = bNo.onclick = null; res(v); };
    bSi.onclick = () => fin(true); bNo.onclick = () => fin(false);
    abrir('ovConfirm'); bNo.focus();
  });
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }
function aviso(t){ const el=document.getElementById('aviso'); el.hidden=!t; el.textContent=t||''; }
/* ---------- carga de datos (se actualiza sola cada 10 segundos) ---------- */
async function cargar(){
  try{
    const filas = await leerFilas('prestamos');
    aviso('');
    const firma = filas.map(f=>f.id+'@'+f.actualizado).join('|');
    if(firma === versionDatos && cargado) return;
    versionDatos = firma;
    const todo = filas.map(f=>({...f.datos, id:f.id}));
    prestadores = todo.filter(x=>x.tipo==='prestador').sort((a,b)=>String(a.creado||'').localeCompare(String(b.creado||'')));
    data = todo.filter(x=>x.tipo!=='prestador');
    cargado = true;
    render();
    const ov = document.getElementById('ovDetalle');
    if(ov.classList.contains('open') && abiertoId) verDetalle(abiertoId);
  }catch(e){
    if(claveRechazada(e)) return;
    aviso(cargado ? 'Sin conexión: los datos pueden no estar actualizados.' : 'No se pudo conectar con la base de datos. Revisa tu conexión a internet.');
  }
}
