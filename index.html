<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mis Negocios</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#060b24">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  --bg:#eef1f8; --bg-glow-1:rgba(56,92,255,.18); --bg-glow-2:rgba(20,184,166,.16);
  --text:#121a33; --muted:#5b6585; --ring:#4f6bff;
  --card-shadow:0 18px 40px -18px rgba(18,26,51,.45);
  --loan-1:#0fb5a2; --loan-2:#127a6c; --car-1:#5468ff; --car-2:#2f2fb8;
  --on-card:#ffffff; --pill:rgba(255,255,255,.18);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060b24; --bg-glow-1:rgba(56,92,255,.30); --bg-glow-2:rgba(20,184,166,.18);
    --text:#f2f5ff; --muted:#a3acd0; --ring:#9fb0ff;
    --card-shadow:0 22px 50px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060b24; --bg-glow-1:rgba(56,92,255,.30); --bg-glow-2:rgba(20,184,166,.18);
  --text:#f2f5ff; --muted:#a3acd0; --ring:#9fb0ff;
  --card-shadow:0 22px 50px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);font:16px/1.45 var(--f-body);background:var(--bg);
  background-image:
    radial-gradient(60vmax 50vmax at 0% 0%, var(--bg-glow-1), transparent 60%),
    radial-gradient(50vmax 45vmax at 100% 100%, var(--bg-glow-2), transparent 60%);
  background-attachment:fixed;
  display:flex;flex-direction:column;
}
main{
  flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:40px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
}
.saludo{margin:0 0 6px;color:var(--muted);font-size:15px;font-weight:600;letter-spacing:.02em}
h1{font-family:var(--f-head);font-size:clamp(26px, 5vw, 40px);margin:0 0 32px;text-align:center;text-wrap:balance;line-height:1.15}
.opciones{display:grid;grid-template-columns:repeat(2, minmax(0, 300px));gap:24px;width:100%;justify-content:center}
.card{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  aspect-ratio:1/1;padding:24px;border-radius:24px;text-decoration:none;color:var(--on-card);
  box-shadow:var(--card-shadow);
  transition:transform .18s ease, box-shadow .18s ease;
}
.card::before{ /* brillo suave arriba */
  content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.28), transparent 55%);
}
.card.loan{background:linear-gradient(150deg, var(--loan-1), var(--loan-2))}
.card.car{background:linear-gradient(150deg, var(--car-1), var(--car-2))}
.card:hover{transform:translateY(-4px)}
.card:active{transform:translateY(-1px)}
.card:focus-visible{outline:3px solid var(--ring);outline-offset:4px}
.card svg{width:44%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.card .t{font-family:var(--f-head);font-size:clamp(22px, 3.4vw, 30px);font-weight:700}
.card .d{font-size:13px;opacity:.9;text-align:center;max-width:22ch}
.card .pill{position:absolute;top:14px;right:14px;font-size:12px;font-weight:600;background:var(--pill);padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px)}
.card .pill:empty{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px calc(16px + env(safe-area-inset-bottom, 0px))}
@media (max-width:560px){
  .opciones{grid-template-columns:1fr;max-width:340px;gap:16px}
  .card{aspect-ratio:auto;flex-direction:row;justify-content:flex-start;padding:20px;gap:16px;border-radius:20px}
  .card svg{width:64px;flex:none}
  .card .txt{display:flex;flex-direction:column;align-items:flex-start}
  .card .d{text-align:left}
  h1{margin-bottom:22px}
}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <p class="saludo" id="saludo">Bienvenido</p>
  <h1>¿A qué sección quieres ingresar?</h1>
  <nav class="opciones" aria-label="Secciones">
    <a class="card loan" href="prestamos.html">
      <span class="pill" id="pPrest"></span>
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M14 6h24l12 12v34a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6Z" fill="#fff"/>
        <path d="M38 6v8a4 4 0 0 0 4 4h8" fill="#d8f5f0"/>
        <rect x="15" y="22" width="20" height="4" rx="2" fill="#127a6c" opacity=".55"/>
        <rect x="15" y="31" width="16" height="4" rx="2" fill="#127a6c" opacity=".55"/>
        <rect x="15" y="40" width="10" height="4" rx="2" fill="#127a6c" opacity=".55"/>
        <circle cx="46" cy="46" r="13" fill="#127a6c" stroke="#fff" stroke-width="3.5"/>
        <path d="M49.5 41.2c-.8-1-2.1-1.6-3.6-1.6-2.1 0-3.7 1.1-3.7 2.8 0 3.9 7.6 2.1 7.6 6.2 0 1.8-1.7 3-3.9 3-1.7 0-3.1-.7-3.9-1.8M46 37.5v2.1M46 52v2.1" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span class="txt"><span class="t">Préstamos</span><span class="d">Clientes, cuotas, abonos y vencimientos</span></span>
    </a>
    <a class="card car" href="vehiculos.html">
      <span class="pill" id="pVeh"></span>
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M14.5 24 19 12.5A5 5 0 0 1 23.7 9.3h16.6a5 5 0 0 1 4.7 3.2L49.5 24" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M10 30a6 6 0 0 1 6-6h32a6 6 0 0 1 6 6v14H10V30Z" fill="#fff"/>
        <rect x="12" y="42" width="10" height="12" rx="3.5" fill="#fff"/>
        <rect x="42" y="42" width="10" height="12" rx="3.5" fill="#fff"/>
        <rect x="4" y="22" width="7" height="5" rx="2.5" fill="#fff"/>
        <rect x="53" y="22" width="7" height="5" rx="2.5" fill="#fff"/>
        <path d="M14.5 31.5h7.5l2 4h-7a3 3 0 0 1-2.5-4Z" fill="#2f2fb8"/>
        <path d="M49.5 31.5H42l-2 4h7a3 3 0 0 0 2.5-4Z" fill="#2f2fb8"/>
        <rect x="25" y="36" width="14" height="4" rx="2" fill="#2f2fb8" opacity=".55"/>
      </svg>
      <span class="txt"><span class="t">Vehículos</span><span class="d">Alquiler diario: conductores, tarifas y pagos</span></span>
    </a>
  </nav>
</main>
<footer>Los datos se guardan en línea y se ven igual en todos tus dispositivos.</footer>
<script src="comun.js"></script>
<script>
(function(){
  const h = new Date().getHours();
  document.getElementById('saludo').textContent = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
})();
// Conteos en vivo: solo si este dispositivo ya tiene la clave (si falla, las tarjetas funcionan igual)
async function contar(tabla, el, uno, varios){
  try{
    const n = (await leerFilas(tabla)).length;
    document.getElementById(el).textContent = n + ' ' + (n===1 ? uno : varios);
  }catch(e){}
}
if(clave){
  contar('prestamos','pPrest','préstamo','préstamos');
  contar('vehiculos','pVeh','vehículo','vehículos');
}
</script>
</body>
</html>
